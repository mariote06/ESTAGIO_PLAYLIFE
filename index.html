/* Verificação do PIN: no servidor quando há ligação online */
async function checkPinAny(){
  const n=$('#tp_n').value,p=$('#tp_p').value.trim();
  if(!alSrv())return checkPin();
  if(!n){ferr('Escolhe o TEF que está em sala.');return null}
  ferr('A verificar…');
  try{const j=await api(alSrv().url,{acao:'pin',codigo:alSrv().codigo,tef:n,pin:p});if(j.ok){$('#ferr').hidden=true;return n}ferr(j.erro||'PIN incorreto.');return null}
  catch(e){ferr('Sem ligação à internet. Guarda sem confirmar e confirma quando tiveres rede.');return null}
}

/* ================= TURNOS SEMANAIS (pedidos, limites, transição) ================= */
const DSEM=[1,2,3,4,5,6,0];
const kSlot=s=>s.dia+'|'+s.ini;
const turnoTxt=s=>`${D3[s.dia]} ${TCOD[s.ini]||s.ini}`;
const semTxt=W=>`${fmtD(W)} – ${fmtD(addD(W,6))}`;
function slotsDiaC(id,d){const W=segunda(d),dow=pd(d).getDay();return LT.semana(S,id,W).slots.filter(s=>s.dia===dow)}
function gridChecks(W,sel,ocup,lim,chg){
  const head=DSEM.map(d=>`<th>${D3[d]}<br><small>${pd(LT.diaData(W,d)).getDate()}</small></th>`).join('');
  const rows=GRID.map(([cod,m])=>`<tr><th class="tc">${cod}</th>${DSEM.map(d=>{const h=m[d];if(!h)return '<td class="off"></td>';
    const k=d+'|'+h[0],on=sel.has(k),n=(ocup[k]||0)+(on?1:0),c=LT.cap(lim,d,h[0]),full=!on&&(ocup[k]||0)>=c,exc=on&&(ocup[k]||0)>=c;
    return `<td class="ck${on?' on':''}${full?' full':''}${exc?' exc':''}"><label><input type="checkbox" data-chg="${chg}" data-k="${k}" data-fim="${h[1]}"${on?' checked':''}${full?' disabled':''}><span class="hr">${h[0]}–${h[1]}</span><small>${full?'completo':exc?'excede '+n+'/'+c:n+'/'+c}</small></label></td>`}).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table class="grade-t ckg"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
const selToSlots=sel=>[...sel].map(k=>{const[dia,ini]=k.split('|');const h=GRID.map(g=>g[1][dia]).find(x=>x&&x[0]===ini);return {dia:Number(dia),ini,fim:h?h[1]:ini}}).sort((a,b)=>((a.dia+6)%7)-((b.dia+6)%7)||a.ini.localeCompare(b.ini));
const horasSlots=sl=>sl.reduce((a,s)=>a+dur(s.ini,s.fim),0);

/* --- Coordenação --- */
function aplicaSemana(id,W,slots,local,estado,pedEm){
  const fimW=addD(W,6),e=estById(id);
  S.horarios=S.horarios.filter(s=>!(s.estId===id&&s.de&&s.de>=W&&s.de<=fimW));
  S.horarios.forEach(s=>{if(s.estId===id&&(!s.de||s.de<W)&&(!s.ate||s.ate>=W))s.ate=addD(W,-1)});
  slots.forEach(x=>S.horarios.push({id:uid(),estId:id,dia:x.dia,ini:x.ini,fim:x.fim,local,tutor:e?.tutor||'',de:W,ate:fimW}));
  S.decisoes=S.decisoes||{};S.decisoes[id]=S.decisoes[id]||{};
  S.decisoes[id][W]={estado,em:Math.max(Date.now(),(pedEm||0)+1),vazia:!slots.length,local};
  if(e&&!e.local&&local)e.local=local;
}
let CW=null;
function semEditHTML(){
  const W=CW.W,ocup=CW.estId?(LT.ocupacao(S,S.pedidos||{},W,CW.estId)[CW.local]||{}):(LT.ocupacao(S,S.pedidos||{},W,'')[CW.local]||{});
  const sl=selToSlots(CW.sel);
  return `<h2>Turnos da semana</h2><p class="small muted" style="margin:0">${semTxt(W)}${CW.ped?' · pedido do estagiário':''}</p>
  <div class="fgrid"><div class="fld"><label for="cw_e">Estagiário</label><select id="cw_e" data-chg="cw_e"><option value="">Escolhe</option>${EV().map(e=>`<option value="${e.id}"${e.id===CW.estId?' selected':''}>${esc(e.nome)}</option>`).join('')}</select></div>
  <div class="fld"><label for="cw_l">Clube</label><select id="cw_l" data-chg="cw_l">${LOCS.map(([k,n])=>`<option value="${k}"${k===CW.local?' selected':''}>${n}</option>`).join('')}</select></div></div>
  ${CW.ped&&CW.ped.obs?`<p class="small" style="margin:0"><b>Nota do estagiário:</b> ${esc(CW.ped.obs)}</p>`:''}
  ${gridChecks(W,CW.sel,ocup,LT.limDe(S.limites,CW.local),'cw_k')}
  <p class="small muted" style="margin:0">${sl.length?`${sl.length} turno(s) · ${fmtH(horasSlots(sl))}`:'Nenhum turno: a semana fica sem estágio.'} Os números mostram a ocupação de cada turno em ${locNome(CW.local)} com este estagiário incluído.</p>
  <p class="ferr" id="ferr" hidden></p>
  <div class="factions"><span class="sp"></span><button class="btn ghost" type="button" data-act="close">Cancelar</button><button class="btn primary" type="button" data-act="cwSave">${CW.ped?'Guardar e validar':'Guardar semana'}</button></div>`;
}
function abreSemEdit(estId,W,extraKey){
  const pl=estId?LT.plano(S,S.pedidos||{},W)[estId]:null,e=estId?estById(estId):null;
  const ped=estId?LT.pendente(S,S.pedidos||{},estId,W):null;
  const local=(ped&&ped.local)||(pl&&pl.slots[0]&&pl.slots[0].local)||e?.local||UI.loc||'PNF';
  const sel=new Set((pl?pl.slots:[]).filter(s=>!s.local||s.local===local).map(kSlot));if(extraKey)sel.add(extraKey);
  CW={W,estId:estId||'',local,sel,ped};showModal(semEditHTML());
}
const reCW=()=>{$('#sheet').innerHTML=semEditHTML()};
A.semEdit=el=>abreSemEdit(el.dataset.id||'',el.dataset.w||UI.week,el.dataset.k||'');
C.cw_e=el=>{const k=[...CW.sel];abreSemEdit(el.value,CW.W);if(!el.value)k.forEach(x=>CW.sel.add(x));reCW()};
C.cw_l=el=>{CW.local=el.value;reCW()};
C.cw_k=el=>{if(el.checked)CW.sel.add(el.dataset.k);else CW.sel.delete(el.dataset.k);reCW()};
A.cwSave=()=>{
  if(!CW.estId){ferr('Escolhe o estagiário.');return}
  const sl=selToSlots(CW.sel),ch=LT.cheios(S,S.pedidos||{},CW.W,CW.estId,CW.local,sl,S.limites);
  if(ch.length){ferr('Turno(s) completo(s): '+ch.map(turnoTxt).join(', ')+'. Altera a escolha ou aumenta o limite em "Limites por turno".');return}
  const ped=CW.ped,mud=ped&&(ped.local!==CW.local||selToSlots(new Set((ped.slots||[]).map(kSlot))).map(kSlot).join()!==sl.map(kSlot).join());
  aplicaSemana(CW.estId,CW.W,sl,CW.local,ped?(mud?'editado':'validado'):'editado',ped?ped.em:0);
  const n=nomeEst(CW.estId);closeModal();save();render();toast(ped?(mud?`Semana de ${n} editada e validada`:`Pedido de ${n} validado`):`Semana de ${n} guardada`);
};
A.pedVal=el=>{const id=el.dataset.id,W=el.dataset.w,p=LT.pendente(S,S.pedidos||{},id,W);if(!p)return;
  const sl=(p.slots||[]).map(s=>({dia:Number(s.dia),ini:s.ini,fim:s.fim})),ch=LT.cheios(S,S.pedidos||{},W,id,p.local,sl,S.limites);
  if(ch.length){toast('Há turnos completos: edita o pedido');abreSemEdit(id,W);return}
  aplicaSemana(id,W,sl,p.local,'validado',p.em);save();render();toast('Pedido de '+nomeEst(id)+' validado')};
A.pedValTodos=()=>{const W=UI.week,loc=UI.loc||'PNF';let n=0,f=0;
  EV().forEach(e=>{const p=LT.pendente(S,S.pedidos||{},e.id,W);if(!p||p.local!==loc)return;const sl=(p.slots||[]).map(s=>({dia:Number(s.dia),ini:s.ini,fim:s.fim}));
    if(LT.cheios(S,S.pedidos||{},W,e.id,p.local,sl,S.limites).length){f++;return}aplicaSemana(e.id,W,sl,p.local,'validado',p.em);n++});
  save();render();toast(`${n} pedido(s) validado(s)${f?` · ${f} com turnos completos ficaram por validar`:''}`)};
C.lim=el=>{S.limites=limNorm(S.limites);const l=el.dataset.l,v=el.value===''?'':Math.max(0,Math.round(Number(el.value)));S.limites[l][el.dataset.k]=v;save();toast(`Limite de ${locNome(l)} guardado`)};
A.limPadrao=el=>{if(!el.dataset.armed){el.dataset.armed=1;el.textContent='Confirmar';return}S.limites=limNorm(S.limites);S.limites[el.dataset.l]=LT.limitesPadrao();save();render();toast(`Limites de ${locNome(el.dataset.l)} repostos`)};
function pedidosPendentes(){const out=[];const W0=segunda(hoje());EV().forEach(e=>Object.keys((S.pedidos||{})[e.id]||{}).forEach(W=>{if(W>=W0&&LT.pendente(S,S.pedidos,e.id,W))out.push({id:e.id,W})}));return out}

V.horarios=()=>{
  const w=UI.week,loc=UI.loc||'PNF',ln=locNome(loc);
  const dias=[...Array(7)].map((_,i)=>addD(w,i));
  const plano=LT.plano(S,S.pedidos||{},w);
  const vis=new Set(EV().map(e=>e.id));
  const naCel=(dia,ini)=>Object.entries(plano).filter(([id,p])=>vis.has(id)).flatMap(([id,p])=>p.slots.filter(s=>s.local===loc&&s.dia===dia&&s.ini===ini).map(s=>({id,estado:p.estado})));
  const head=dias.map(d=>{const dt=pd(d),f=S.form.find(x=>x.data===d);return `<th class="${d===hoje()?'hj':''}">${D3[dt.getDay()]} ${dt.getDate()}${f?`<br><span class="pill warn">Formação ${f.n}</span>`:''}</th>`}).join('');
  const rows=GRID.map(([cod,m])=>`<tr><th class="tc">${cod}</th>${dias.map(d=>{const dia=pd(d).getDay(),h=m[dia];if(!h)return '<td class="off"></td>';
    const quem=naCel(dia,h[0]),c=LT.cap(LT.limDe(S.limites,loc),dia,h[0]),n=quem.length;
    return `<td class="cell${d===hoje()?' hj':''}"><span class="hr">${h[0]}–${h[1]} <b class="capn${n>c?' over':n===c?' full':''}">${n}/${c}</b></span>${quem.map(q=>`<button class="nm-btn ${q.estado==='pendente'?'pend':q.estado==='transitado'?'trans':''}" type="button" data-act="semEdit" data-id="${q.id}" data-w="${w}" title="${q.estado==='pendente'?'Pedido por validar':q.estado==='transitado'?'Mantém a escolha de uma semana anterior':'Validado'}">${q.estado==='transitado'?'↻ ':''}${esc(nomeEst(q.id))}</button>`).join('')}${n<c?`<button class="add-btn" type="button" data-act="semEdit" data-w="${w}" data-k="${dia}|${h[0]}" aria-label="Adicionar estagiário ${cod} ${D3[dia]}">+</button>`:''}</td>`}).join('')}</tr>`).join('');
  const fora=Object.entries(plano).filter(([id])=>vis.has(id)).flatMap(([id,p])=>p.slots.filter(s=>s.local===loc&&!GRID.some(([,m])=>m[s.dia]&&m[s.dia][0]===s.ini)).map(s=>`<button class="slot" type="button" data-act="semEdit" data-id="${id}" data-w="${w}"><b>${esc(nomeEst(id))}</b><span>${D3[s.dia]} · ${s.ini}–${s.fim}</span></button>`)).join('');
  const semLoc=EV().filter(e=>(plano[e.id]?.slots||[]).some(s=>!s.local));
  const semLocHTML=semLoc.map(e=>`<li><span>${esc(e.nome)}</span><span class="sp"></span><button class="btn sm" type="button" data-act="setLoc" data-id="${e.id}" data-l="PNF">Penafiel</button><button class="btn sm" type="button" data-act="setLoc" data-id="${e.id}" data-l="LSD">Lousada</button></li>`).join('');
  const peds=EV().map(e=>({e,p:plano[e.id]})).filter(x=>x.p&&x.p.estado==='pendente'&&x.p.pedido.local===loc);
  const pedHTML=peds.map(({e,p})=>{const sl=p.slots,ch=LT.cheios(S,S.pedidos||{},w,e.id,p.pedido.local,sl,S.limites);return `<div class="ritem"><span><b>${esc(e.nome)}</b> · ${fmtH(horasSlots(sl))}<small class="muted" style="display:block">${sl.length?sl.map(turnoTxt).join(', '):'Sem turnos nesta semana'}${p.pedido.obs?' · “'+esc(p.pedido.obs)+'”':''}</small>${ch.length?`<small style="display:block;color:var(--bad)">Completo: ${ch.map(turnoTxt).join(', ')}</small>`:''}</span><span class="rcols"><button class="btn sm" type="button" data-act="semEdit" data-id="${e.id}" data-w="${w}">Editar</button>${ch.length?'':`<button class="btn sm primary" type="button" data-act="pedVal" data-id="${e.id}" data-w="${w}">Validar</button>`}</span></div>`}).join('');
  const sem=EV().map(e=>({e,p:plano[e.id]})).filter(x=>x.p&&x.p.slots.some(s=>s.local===loc));
  const resumo=sem.map(({e,p})=>{const sl=p.slots.filter(s=>s.local===loc);return `<tr><td>${esc(e.nome)}</td><td>${p.estado==='pendente'?'<span class="pill warn">pedido por validar</span>':p.estado==='transitado'?`<span class="pill">mantém semana de ${fmtD(p.de)}</span>`:(S.decisoes?.[e.id]?.[w]?`<span class="pill ok">${S.decisoes[e.id][w].estado==='validado'?'validado':'definido pela coordenação'}</span>`:'<span class="pill ok">definido</span>')}</td><td class="num">${fmtH(horasSlots(sl))}</td></tr>`}).join('');
  const limRows=GRID.map(([cod,m])=>`<tr><th class="tc">${cod}</th>${DSEM.map(d=>{const h=m[d];if(!h)return '<td class="off"></td>';const k=d+'|'+h[0];return `<td><input type="number" min="0" value="${LT.cap(LT.limDe(S.limites,loc),d,h[0])}" data-chg="lim" data-l="${loc}" data-k="${k}" aria-label="Limite ${cod} ${D3[d]}"></td>`}).join('')}</tr>`).join('');
  return `<div class="bar-head"><h2 class="sec">Horário de ${ln}</h2><span class="sp"></span><button class="btn primary" type="button" data-act="semEdit" data-w="${w}">Definir semana de um estagiário</button></div>
  <div class="seg" role="tablist">${LOCS.map(([k,n])=>`<button type="button" role="tab" aria-selected="${loc===k}" data-act="loc" data-k="${k}">${n}<span>${EV().filter(e=>(plano[e.id]?.slots||[]).some(s=>s.local===k)).length}</span></button>`).join('')}</div>
  ${semLocHTML?`<div class="panel warnp"><h3>Estagiários sem clube</h3><p class="small muted" style="margin:0 0 8px">Escolhe o clube de cada um. Os turnos deles sem clube passam para esse horário.</p><ul class="todo loclist">${semLocHTML}</ul></div>`:''}
  <div class="bar-head"><button class="btn sm" type="button" data-act="week" data-d="-7" aria-label="Semana anterior">‹</button><b>${semTxt(w)}</b><button class="btn sm" type="button" data-act="week" data-d="7" aria-label="Semana seguinte">›</button><button class="btn sm ghost" type="button" data-act="week" data-d="0">Esta semana</button><span class="sp"></span><button class="btn sm" type="button" data-act="genSemana">Registar horas desta semana</button></div>
  ${peds.length?`<div class="panel warnp"><div class="bar-head"><h3 style="margin:0">Pedidos por validar · ${ln}</h3><span class="sp"></span>${peds.length>1?'<button class="btn sm primary" type="button" data-act="pedValTodos">Validar todos</button>':''}</div><div style="margin-top:6px">${pedHTML}</div></div>`:''}
  <div class="tbl-wrap"><table class="grade-t"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  <p class="small muted" style="margin:0"><span class="nm-key">Nome</span> validado · <span class="nm-key pend">Nome</span> pedido por validar · <span class="nm-key trans">↻ Nome</span> sem escolha nova, mantém a semana anterior. O número ao lado da hora é a ocupação face ao limite. Toca num nome para validar ou alterar a semana desse estagiário.</p>
  ${fora?`<div><h3>Fora da grelha</h3><div class="week">${fora}</div></div>`:''}
  <div><h3>Estagiários em ${ln} nesta semana</h3>${resumo?`<div class="tbl-wrap"><table><tbody>${resumo}</tbody></table></div>`:'<p class="empty">Nenhum estagiário com turnos neste clube nesta semana.</p>'}</div>
  <details class="panel"><summary><b>Mapa de aulas de grupo · ${ln}</b> <span class="small muted">(${(S.mapaAulas?.[loc]||[]).length} aulas por semana)</span></summary><p class="small muted" style="margin:10px 0 8px">Os estagiários escolhem a aula desta lista quando registam uma aula de grupo. Uma aula por linha: <b>Dia;Início;Fim;Aula</b>, por exemplo <i>Seg;18:00;19:00;Crosstraining</i>.</p><textarea id="mapaTxt" rows="10" aria-label="Mapa de aulas de ${ln}">${esc(mapaTxt(S.mapaAulas?.[loc]))}</textarea><div class="inline" style="margin-top:8px"><button class="btn primary" type="button" data-act="mapaGuardar" data-l="${loc}">Guardar mapa de ${ln}</button></div></details>
  <details class="panel"><summary><b>Limites por turno · ${ln}</b> <span class="small muted">(máximo de estagiários em cada turno de ${ln}; muda de clube no topo para editar o outro)</span></summary><div class="tbl-wrap" style="margin-top:10px"><table class="grade-t limg"><thead><tr><th></th>${DSEM.map(d=>`<th>${D3[d]}</th>`).join('')}</tr></thead><tbody>${limRows}</tbody></table></div><div class="inline" style="margin-top:8px"><button class="btn sm ghost" type="button" data-act="limPadrao" data-l="${loc}">Repor limites iniciais de ${ln}</button></div></details>`;
};
A.mapaGuardar=el=>{const l=el.dataset.l,txt=$('#mapaTxt').value,arr=parseMapa(txt),linhas=txt.split('\n').filter(x=>x.trim()).length;S.mapaAulas=S.mapaAulas||{};S.mapaAulas[l]=arr;save();render();toast(`${arr.length} aula(s) guardada(s)${linhas>arr.length?` · ${linhas-arr.length} linha(s) ignorada(s) por erro de formato`:''}`)};
A.genSemana=()=>{
  let n=0;const lim=hoje();
  for(let i=0;i<7;i++){const d=addD(UI.week,i);if(d>lim)break;
    S.est.forEach(e=>slotsDiaC(e.id,d).forEach(s=>{if(!S.registos.some(r=>r.estId===e.id&&r.data===d&&r.ini===s.ini)){S.registos.push({id:uid(),estId:e.id,data:d,ini:s.ini,fim:s.fim,tipo:'Sala',nota:'Do horário'});n++}}))}
  save();render();toast(n?`${n} registo(s) criado(s)`:'Nada novo a registar nesta semana');
};

/* --- Estagiário --- */
function alEstadoSemana(W){const m=alMe(),ped=(AL.pedidos||{})[W],dec=((AL.cfg.decisoes||{})[m.id]||{})[W];
  if(ped&&(!dec||ped.em>dec.em))return ['warn','Por validar'];
  if(dec)return dec.estado==='validado'?['ok','Validado']:['acc','Definido pelo coordenador'];
  return ['','Sem escolha: mantém a anterior'];}
const proxSemanas=()=>{const W0=addD(segunda(hoje()),7);return [0,1,2,3].map(i=>addD(W0,7*i))};
function alPlanoSemana(W){const m=alMe();return LT.plano(AL.cfg,{[m.id]:AL.pedidos||{}},W)[m.id]||{slots:[]}}
async function alCarregaOcup(W){if(!alSrv())return;try{const j=await api(alSrv().url,{acao:'ocupacao',codigo:alSrv().codigo,semanas:[W]});if(j.ok){AUI.ocup=AUI.ocup||{};AUI.ocup[W]=j.ocup[W]||{};AUI.lim=j.limites;if(j.meus)AL.pedidos=j.meus;alSaveLocal();if(AUI.esc===W)renderAluno()}else toast(j.erro||'Erro')}catch(e){AUI.ocupErr=e.message;if(AUI.esc===W)renderAluno()}}
function escolhaHTML(){
  const W=AUI.esc,m=alMe(),oc=(AUI.ocup||{})[W];
  if(!oc)return `<div class="panel"><h3>Turnos para ${semTxt(W)}</h3><p class="empty">${AUI.ocupErr?esc(AUI.ocupErr):'A carregar a ocupação dos turnos…'}</p><button class="btn ghost" type="button" data-act="al_escFechar">Voltar</button></div>`;
  const loc=AUI.escLoc||m.local||'';
  const sl=selToSlots(AUI.sel);
  return `<div class="panel"><div class="bar-head"><h3 style="margin:0">Turnos para ${semTxt(W)}</h3><span class="sp"></span><button class="btn sm ghost" type="button" data-act="al_escFechar">Cancelar</button></div>
  <p class="small muted" style="margin:6px 0 10px">Escolhe os turnos em que vais estagiar. Os turnos completos não podem ser escolhidos. Depois de enviares, o coordenador do clube valida ou ajusta. Se não escolheres, mantém-se o horário da semana anterior.</p>
  <div class="fgrid"><div class="fld"><label for="esc_l">Clube</label><select id="esc_l" data-chg="al_escLoc"><option value="">Escolhe</option>${LOCS.map(([k,n])=>`<option value="${k}"${k===loc?' selected':''}>${n}</option>`).join('')}</select></div></div>
  ${loc?gridChecks(W,AUI.sel,oc[loc]||{},LT.limDe(AUI.lim||AL.cfg.limites,loc),'al_escK'):'<p class="empty">Escolhe o clube para veres os turnos.</p>'}
  <div class="fld" style="margin-top:10px"><label for="esc_o">Nota para o coordenador (opcional)</label><input id="esc_o" value="${esc(AUI.escObs||'')}" data-chg="al_escObs" placeholder="ex.: na sexta tenho exame"></div>
  <p class="small" style="margin:10px 0"><b>${sl.length} turno(s) · ${fmtH(horasSlots(sl))}</b>${sl.length?'':' · vais indicar que não estagias nesta semana'}</p>
  <p class="ferr" id="ferr" hidden></p>
  <button class="btn primary" type="button" data-act="al_escEnviar"${loc?'':' disabled'}>Enviar escolha</button></div>`;
}
A.al_esc=el=>{const W=el.dataset.w;const p=alPlanoSemana(W);AUI.esc=W;AUI.escLoc=(p.slots[0]&&p.slots[0].local)||alMe().local||'';AUI.sel=new Set(p.slots.filter(s=>!AUI.escLoc||s.local===AUI.escLoc).map(kSlot));AUI.escObs=((AL.pedidos||{})[W]||{}).obs||'';AUI.ocupErr='';renderAluno();window.scrollTo(0,0);alCarregaOcup(W)};
A.al_escFechar=()=>{AUI.esc=null;renderAluno()};
C.al_escLoc=el=>{AUI.escLoc=el.value;AUI.sel=new Set();renderAluno()};
C.al_escK=el=>{if(el.checked)AUI.sel.add(el.dataset.k);else AUI.sel.delete(el.dataset.k);renderAluno()};
C.al_escObs=el=>{AUI.escObs=el.value};
A.al_escEnviar=async el=>{
  const W=AUI.esc,loc=AUI.escLoc;if(!loc){ferr('Escolhe o clube.');return}
  const ob=$('#esc_o');if(ob)AUI.escObs=ob.value;
  el.disabled=true;el.textContent='A enviar…';
  try{const j=await api(alSrv().url,{acao:'pedir',codigo:alSrv().codigo,semana:W,local:loc,slots:selToSlots(AUI.sel),obs:AUI.escObs||''});
    if(j.ok){AL.pedidos=AL.pedidos||{};AL.pedidos[W]=j.pedido;alSaveLocal();AUI.esc=null;renderAluno();toast('Escolha enviada. Aguarda a validação do coordenador.');return}
    if(j.cheios){j.cheios.forEach(s=>AUI.sel.delete(kSlot(s)));await alCarregaOcup(W);ferr('Entretanto ficaram completos: '+j.cheios.map(turnoTxt).join(', ')+'. Tirei-os da tua escolha.');}
    else ferr(j.erro||'Não foi possível enviar.')}
  catch(e){ferr('Sem ligação à internet. Tenta de novo quando tiveres rede.')}
  const b=$('[data-act="al_escEnviar"]');if(b){b.disabled=false;b.textContent='Enviar escolha'}
};
function escolhasHTML(){
  if(!alSrv())return `<div class="panel"><h3>Escolher turnos</h3><p class="small muted" style="margin:0">A escolha semanal de turnos precisa da ligação pessoal que o coordenador te envia.</p></div>`;
  return `<div class="panel"><h3>Escolher turnos</h3><p class="small muted" style="margin:0 0 8px">Escolhe os teus turnos de cada semana. Sem escolha, mantém-se o horário da semana anterior.</p>${proxSemanas().map(W=>{const[c,t]=alEstadoSemana(W);const p=alPlanoSemana(W);return `<div class="ritem"><span><b>${semTxt(W)}</b><small class="muted" style="display:block">${p.slots.length?p.slots.map(turnoTxt).join(', ')+' · '+fmtH(horasSlots(p.slots)):'Sem turnos'}</small></span><span class="rcols"><span class="pill ${c}">${t}</span><button class="btn sm" type="button" data-act="al_esc" data-w="${W}">${(AL.pedidos||{})[W]?'Alterar':'Escolher'}</button></span></div>`}).join('')}</div>`;
}

/* ================= TUTORIAL DO ESTAGIÁRIO ================= */
const demoShift=(dia,num,lab,hora,pill,cls,extra)=>`<div class="shift demo" aria-hidden="true"><span class="sd"><b>${dia}</b><small>${num}</small></span><span class="sm"><b>${lab}</b> · ${hora}${extra?`<small>${extra}</small>`:''}</span><span class="pill ${cls}">${pill}</span></div>`;
const TUT=[
 {t:'Bem-vindo à tua app de estágio',b:`<p>Aqui tens tudo o que precisas durante o estágio na Playlife: o teu horário, o registo de presenças, as aulas de grupo, as formações de sexta e o dossier de estágio.</p>
  <p>Começa por <b>guardar a app no ecrã principal</b> do telemóvel, para a abrires como qualquer outra app:</p>
  <ul><li><b>Android (Chrome):</b> menu <b>⋮</b> → <b>Adicionar ao ecrã principal</b>.</li><li><b>iPhone (Safari):</b> botão <b>Partilhar</b> → <b>Adicionar ao ecrã principal</b>.</li></ul>
  <p class="small muted">Abre sempre a app a partir desse ícone ou da ligação que o coordenador te enviou. A ligação já tem o teu código pessoal.</p>`},
 {t:'Hoje: o teu ponto de situação',b:`<div class="demo-box" aria-hidden="true"><div class="lbl" style="margin-top:0">Horas de estágio</div><div class="track lg"><i style="width:38%"></i></div><div class="lbl">Dossier de estágio</div><div class="track lg"><i style="width:22%"></i></div></div>
  <p>No separador <b>Hoje</b> vês duas barras: as <b>horas feitas</b> face às horas exigidas e o <b>progresso do dossier</b>. Vão enchendo à medida que registas presenças e preenches o dossier.</p>
  <p>Logo abaixo aparece o turno de hoje, os próximos turnos e a próxima formação de sexta.</p>`},
 {t:'Registar a presença no turno',b:`${demoShift('seg','26 out','T4','16:30–19:30','Agendado','')}
  <ol><li>No início ou no fim do turno, <b>toca no turno</b>.</li><li>Confirma as horas de <b>entrada</b> e de <b>saída</b>.</li><li>Entrega o telemóvel ao <b>TEF que está em sala</b>: ele escolhe o nome dele e escreve o <b>PIN</b> e dá uma nota de <b>0 a 20</b> à tua prestação no turno.</li><li>Carrega em <b>Registar e confirmar</b>.</li></ol>
  ${demoShift('seg','26 out','T4','16:30–19:30','Confirmado','ok','Confirmado por Diogo Neto')}
  <p class="small muted">Se o TEF estiver ocupado, usa <b>Guardar sem confirmar</b> e pede a confirmação mais tarde. <b>Só as horas confirmadas contam.</b> Se faltares, toca no turno, escreve o motivo e carrega em <b>Não compareci</b>.</p>`},
 {t:'Aulas de grupo também contam',b:`${demoShift('qui','29 out','Aula · Pilates','19:00–20:00','Confirmado','ok','Confirmado por Ricardo Malta')}
  <p>Sempre que participares numa aula de grupo, carrega em <b>Registar aula de grupo</b> (no Hoje ou nas Presenças).</p>
  <ul><li>Escolhe a data, a modalidade, as horas e o que fizeste: <b>Assistiu</b>, <b>Apoiou o instrutor</b> ou <b>Lecionou</b>.</li><li>O <b>instrutor da aula</b> confirma com o PIN dele e avalia a tua prestação de 0 a 20.</li><li>Se lecionaste, a app cria um <b>relatório</b> no dossier para preencheres.</li></ul>
  <p class="small muted">Se a aula ou uma formação coincidir com o teu turno, as horas não contam a dobrar: conta a aula ou a formação e, do turno, só o tempo fora dela. Exemplo: turno de 3 h com 1 h de aula = 2 h de sala + 1 h de aula.</p>`},
 {t:'Escolher os teus turnos da semana',b:`<div class="demo-grid" aria-hidden="true"><span class="dg on">T1<small>1/2</small></span><span class="dg">T2<small>0/1</small></span><span class="dg full">T3<small>completo</small></span><span class="dg on">T4<small>2/2</small></span></div>
  <p>Em <b>Horário → Escolher turnos</b> escolhes os turnos de cada uma das próximas semanas.</p>
  <ul><li>Cada turno tem um <b>limite de estagiários</b>. Os números mostram a ocupação; os <b>completos</b> não podem ser escolhidos.</li><li>Escolhe o clube, marca os turnos e carrega em <b>Enviar escolha</b>. Podes deixar uma nota, por exemplo um exame.</li><li>O <b>coordenador do clube valida</b> ou ajusta a tua escolha.</li><li>Se não escolheres, <b>mantém-se o horário da semana anterior</b>.</li></ul>
  <p class="small muted">A semana em curso já não pode ser alterada: escolhe com antecedência.</p>`},
 {t:'Dossier de estágio',b:`<div class="demo-box" aria-hidden="true"><div class="ritem"><span>Ensina o cliente a utilizar os equipamentos</span><span class="rcols"><span class="mini"><input type="checkbox" checked disabled>Aluno</span><span class="pill ok">PT · Diogo</span></span></div></div>
  <p>O dossier tem 15 secções, cada uma com a sua barra de progresso.</p>
  <ul><li><b>Missão e Manifesto:</b> lê e marca <b>Li e compreendi</b>.</li><li><b>Equipamentos e exercícios:</b> toca em cada item e escreve os grupos musculares, os pontos-chave e os erros comuns.</li><li><b>Funções do TEF e módulos:</b> marca <b>Aluno</b> quando dominares o item.</li><li><b>Validação:</b> carrega em <b>Validação pelo TEF</b>. O TEF escreve o PIN e durante 15 minutos pode marcar a coluna <b>PT</b> e a checklist das aulas de grupo.</li></ul>`},
 {t:'Formações de sexta',b:`<p>São <b>14 formações</b>, às sextas das <b>14h30 às 16h30</b>, entre outubro e fevereiro, em Penafiel ou em Lousada. Vês o calendário, o tema e o formador em <b>Horário</b>.</p>
  <p>No fim de cada formação, carrega em <b>Confirmar presença</b> (no Hoje ou em Horário) e entrega o telemóvel ao <b>formador</b>: ele escolhe o nome, escreve o PIN e avalia a tua prestação de 0 a 20. As horas de cada formação entram no teu total de horas de estágio.</p>`},
 {t:'Regras importantes',b:`<ul class="rules"><li><b>O PIN é do TEF.</b> Nunca peças o PIN a um TEF nem o escrevas tu. Entrega-lhe o telemóvel.</li><li><b>O teu código é pessoal.</b> Não partilhes a tua ligação nem o código com colegas.</li><li><b>Os dados sincronizam sozinhos</b> com o coordenador. Sem internet, a app guarda e envia quando tiveres rede; a confirmação pelo TEF precisa de internet.</li><li><b>Não limpes os dados do browser</b> enquanto houver alterações por enviar (aparece um aviso em Perfil).</li></ul>
  <p>Podes rever este tutorial quando quiseres em <b>Perfil → Ver tutorial</b>. Bom estágio!</p>`}
];
let TI=0;
function tutHTML(){const st=TUT[TI],last=TI===TUT.length-1;
  return `<div class="tut"><div class="tut-top"><span class="tut-n">${TI+1} / ${TUT.length}</span><button class="btn sm ghost" type="button" data-act="tutFim">${last?'Fechar':'Saltar'}</button></div>
  <h2>${st.t}</h2><div class="tut-b">${st.b}</div>
  <div class="tut-dots" aria-hidden="true">${TUT.map((_,i)=>`<i class="${i===TI?'on':''}"></i>`).join('')}</div>
  <div class="factions">${TI?'<button class="btn" type="button" data-act="tutAnt">Anterior</button>':''}<span class="sp"></span><button class="btn primary" type="button" data-act="${last?'tutFim':'tutSeg'}">${last?'Começar':'Seguinte'}</button></div></div>`}
function abreTutorial(i){TI=i||0;showModal(tutHTML());$('#sheet').classList.add('sheet-tut')}
A.tutSeg=()=>{TI=Math.min(TUT.length-1,TI+1);$('#sheet').innerHTML=tutHTML();$('#sheet').scrollTop=0};
A.tutAnt=()=>{TI=Math.max(0,TI-1);$('#sheet').innerHTML=tutHTML();$('#sheet').scrollTop=0};
A.tutFim=()=>{AL.tutVisto=Date.now();alSaveLocal();$('#sheet').classList.remove('sheet-tut');closeModal()};
A.tutAbrir=()=>abreTutorial(0);

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(el&&A[el.dataset.act]){A[el.dataset.act](el,ev)}else if(ev.target.id==='modal')closeModal()});
document.addEventListener('change',ev=>{const el=ev.target.closest('[data-chg]');if(el&&C[el.dataset.chg])C[el.dataset.chg](el)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#modal').hidden)closeModal();if(ev.key==='Enter'&&ev.target.id==='novoTutor')A.addTutor();if(ev.key==='Enter'&&ev.target.id==='cpin')A.coordIn();if(ev.key==='Enter'&&ev.target.id==='cjKey')$('[data-act="coordJoin"]').click()});
(function boot(){
  if(!MODO&&HAD)MODO='coord';
  const h=location.hash;
  if(h.startsWith('#cfg=')){try{if(applyCfg(decodeCfg(h.slice(5)))){toast('Horários e formações atualizados');if(MODO!=='coord'&&AL.me)MODO='aluno'}}catch(e){toast('A ligação de configuração não é válida')}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
  if(h.startsWith('#coord=')){try{const o=unb64(h.slice(7));if(o.s&&!coordSrv()){CONVITE=o.s;MODO=''}else if(coordSrv())toast('Este dispositivo já está ligado como coordenador')}catch(e){toast('Este convite não é válido')}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
  let acesso=null;
  if(h.startsWith('#acesso=')){try{acesso=unb64(h.slice(8))}catch(e){toast('Esta ligação não é válida')}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
  if(MODO==='coord')migrOld();
  if(MODO==='aluno'&&alMe())alMigrate();
  render();
  if(acesso&&acesso.s&&acesso.c){if(MODO==='coord')toast('Esta é a ligação de um estagiário. Sai da coordenação para a testar.');else alEntrar(acesso.s,acesso.c).then(ok=>{if(!ok){toast(AL.erro||'Não foi possível entrar');render()}})}
  else if(MODO==='coord'&&coordSrv())coordPull();
  else if(MODO==='aluno'&&alSrv())alPull().then(()=>{if(MODO==='aluno')render()});
  const refresca=()=>{if(document.visibilityState!=='visible')return;if(MODO==='coord'&&coordSrv())coordPull();else if(MODO==='aluno'&&alSrv())alPull().then(ok=>{if(ok&&MODO==='aluno'&&$('#modal').hidden&&!document.activeElement.matches('input,textarea,select'))render()})};
  document.addEventListener('visibilitychange',refresca);window.addEventListener('online',refresca);
})();
