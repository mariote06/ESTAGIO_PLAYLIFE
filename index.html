<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Estágios Playlife</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho de clube + barra de separadores fixa; cada separador é uma folha da "caderneta de estágio" */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E3E8ED; --ink:#15202B; --muted:#5A6774; --line:#D3DAE1;
  --accent:#0A6C96; --accent-ink:#FFFFFF; --accent-soft:#D9ECF5;
  --ok:#2C7A4B; --ok-soft:#DCEFE3; --warn:#9A5A00; --warn-soft:#F7E8CF; --bad:#B3261E; --bad-soft:#F7DEDB;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#17202A; --sunk:#111920; --ink:#E5ECF2; --muted:#93A1AE; --line:#29353F;
  --accent:#53B4DF; --accent-ink:#04202D; --accent-soft:#123142;
  --ok:#62C48D; --ok-soft:#14301F; --warn:#E3A548; --warn-soft:#352610; --bad:#F2877F; --bad-soft:#3A1715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#17202A; --sunk:#111920; --ink:#E5ECF2; --muted:#93A1AE; --line:#29353F;
  --accent:#53B4DF; --accent-ink:#04202D; --accent-soft:#123142;
  --ok:#62C48D; --ok-soft:#14301F; --warn:#E3A548; --warn-soft:#352610; --bad:#F2877F; --bad-soft:#3A1715; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:10px 12px 9px;border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:18px 60px;display:grid;gap:18px}
h2.sec{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}
.bar-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bar-head .sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{font:inherit;font-weight:500;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:32px;font-weight:700;line-height:1}
.stat span{color:var(--muted);font-size:13px}
.next{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:14px}
.datebox{background:var(--accent);color:var(--accent-ink);border-radius:8px;text-align:center;padding:6px 12px;font-family:var(--display);line-height:1}
.datebox b{display:block;font-size:30px}
.datebox span{font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.next .lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.next .t{font-weight:600;font-size:16px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--display);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.prog{display:flex;align-items:center;gap:8px;min-width:150px}
.track{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.track i.done{background:var(--ok)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.todo{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:10px;align-items:baseline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.card .nm{font-weight:600;font-size:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 6px 4px 12px;font-size:14px}
.chip button{border:0;background:var(--sunk);color:var(--muted);border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;line-height:1}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:5px 12px;cursor:pointer}
button.chip{cursor:pointer;padding:5px 12px;font:inherit;font-size:14px;color:var(--ink)}
.inline{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day h4{margin:0;font-family:var(--display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between}
.slot{text-align:left;font:inherit;font-size:13px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--sunk);color:var(--ink);border-radius:6px;padding:5px 7px;cursor:pointer;display:grid;gap:1px}
.slot b{font-weight:600}
.slot.form{border-left-color:var(--warn);background:var(--warn-soft);cursor:default}
.empty{color:var(--muted);font-size:13px}
.row-btn{width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.fnum{font-family:var(--display);font-weight:700;font-size:26px;color:var(--muted);text-align:center;line-height:1}
.fitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.fitem.past .fnum{color:var(--accent)}
.fbody{border-top:1px solid var(--line);margin-top:10px;padding-top:12px;display:grid;gap:12px}
.pres{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.pres label{display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.pres input{width:18px;height:18px;accent-color:var(--accent)}
.grade{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.grade small{font-size:14px;color:var(--muted);font-weight:500}
.crit{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;align-items:center}
.dots{display:flex;gap:3px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--sunk)}
.dots i.on{background:var(--accent)}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.size{border:1px solid var(--line);border-radius:8px;text-align:center;padding:8px 4px;background:var(--surface)}
.size b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.size span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td select,td input{padding:4px 6px;font-size:14px}
td input[type=number]{width:64px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,14,20,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:12px;width:100%;max-width:560px;padding:18px;display:grid;gap:14px}
.sheet h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;margin:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fld{display:grid;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.fld .lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select{width:100%}
.scale{display:flex;gap:4px}
.scale label{flex:1}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale span{display:block;text-align:center;padding:6px 0;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;font-size:14px}
.scale input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.factions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.factions .sp{flex:1}
.ferr{grid-column:1/-1;color:var(--bad);margin:0;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}.brand h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <div class="brand"><h1>Estágios Playlife</h1><p>Sala de exercício · 2026/27 · PNF / LSD</p></div>
  <button class="btn" data-act="dados" type="button">Dados</button>
</div></header>
<nav class="tabs" aria-label="Separadores"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="main"></div></main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>
const KEY='estagios_playlife_v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const D3=['dom','seg','ter','qua','qui','sex','sáb'];
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const TAM=['XS','S','M','L','XL','XXL'];
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const ds=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoje=()=>ds(new Date());
const fmtD=s=>{if(!s)return'—';const d=pd(s);return `${D3[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}`};
const fmtDY=s=>{if(!s)return'—';const d=pd(s);return `${d.getDate()} ${MES[d.getMonth()]} ${d.getFullYear()}`};
const mins=t=>{if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+(m||0)};
const dur=(a,b)=>Math.max(0,mins(b)-mins(a));
const fmtH=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return r?`${h}h${String(r).padStart(2,'0')}`:`${h}h`};
const segunda=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const n1=x=>x==null?'—':x.toFixed(1).replace('.',',');

function seed(){
  const est=[]; /* os estagiários entram por importação (Dados → Importar), para não ficarem no código público */
  const datas=['2026-10-30','2026-11-06','2026-11-13','2026-11-20','2026-11-27','2026-12-04','2026-12-11','2026-12-18','2027-01-08','2027-01-15','2027-01-22','2027-01-29','2027-02-05','2027-02-12'];
  const form=datas.map((d,i)=>({id:uid(),n:i+1,data:d,ini:'',fim:'',duracao:2,tema:'',formador:'',local:'',sumario:'',pres:{}}));
  const criterios=[['Assiduidade e pontualidade',1],['Apresentação e postura profissional',1],['Relação e comunicação com clientes',1.5],['Conhecimento técnico',1.5],['Prescrição e correção do exercício',2],['Iniciativa e autonomia',1],['Trabalho em equipa',1],['Participação nas formações',1]].map(([nome,peso])=>({id:uid(),nome,peso}));
  return {v:1,est,tutores:[],horarios:[],registos:[],form,aval:[],criterios};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!Array.isArray(S.est))S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
save();

const UI={tab:'inicio',week:segunda(hoje()),hEst:'',fOpen:null,aEst:''};
try{const t=localStorage.getItem(KEY+'_tab');if(t)UI.tab=t}catch(e){}

const TABS=[['inicio','Início'],['estagiarios','Estagiários'],['horarios','Horários'],['horas','Horas'],['formacoes','Formações'],['avaliacao','Avaliação'],['equipamentos','Equipamentos']];
const estById=id=>S.est.find(e=>e.id===id);
const nomeEst=id=>estById(id)?.nome||'(removido)';
const TCOD={'06:30':'T1','10:30':'T2','13:30':'T3','16:30':'T4','19:30':'T5','09:00':'T1','09:30':'T1','15:30':'T2'};
const turnoCod=s=>TCOD[s.ini]?TCOD[s.ini]+' · ':'';
const fDur=f=>(f.ini&&f.fim)?dur(f.ini,f.fim):(Number(f.duracao)||0)*60;
function horasEst(id){
  const sala=S.registos.filter(r=>r.estId===id).reduce((a,r)=>a+dur(r.ini,r.fim),0);
  const form=S.form.filter(f=>f.pres[id]).reduce((a,f)=>a+fDur(f),0);
  return {sala,form,total:sala+form};
}
function notaAval(a){let s=0,w=0;S.criterios.forEach(c=>{const v=a.notas?.[c.id];if(v){s+=v*c.peso;w+=c.peso}});return w?Math.round(s/w/5*200)/10:null}
const ativo=(s,date)=>s.dia===pd(date).getDay()&&(!s.de||s.de<=date)&&(!s.ate||s.ate>=date);
const formRealizada=f=>f.data<=hoje();
function progHTML(e){
  const h=horasEst(e.id);
  if(!e.horasReq)return `<div class="prog"><span>${fmtH(h.total)}</span><span class="pill warn">meta por definir</span></div>`;
  const p=Math.min(100,h.total/(e.horasReq*60)*100);
  return `<div class="prog"><div class="track"><i class="${p>=100?'done':''}" style="width:${p}%"></i></div><span class="small">${fmtH(h.total)} / ${e.horasReq}h</span></div>`;
}

function render(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" type="button" data-act="tab" data-k="${k}" aria-current="${UI.tab===k}">${l}</button>`).join('');
  $('#main').innerHTML=(V[UI.tab]||V.inicio)();
}

const V={};
V.inicio=()=>{
  const prox=S.form.filter(f=>f.data>=hoje()).sort((a,b)=>a.data.localeCompare(b.data))[0];
  const feitas=S.form.filter(formRealizada).length;
  const totH=S.est.reduce((a,e)=>a+horasEst(e.id).total,0);
  const semTutor=S.est.filter(e=>!e.tutor).length,semLocal=S.est.filter(e=>!e.local).length,semMeta=S.est.filter(e=>!e.horasReq).length;
  const semEquip=S.est.filter(e=>!(e.entT>0&&e.entC>0)).length;
  const fSemTema=S.form.filter(f=>!f.tema||!f.formador).length;
  const todo=[];
  if(semLocal)todo.push(['warn',`${semLocal} estagiário(s) sem local (PNF/LSD)`,'estagiarios']);
  if(semTutor)todo.push(['warn',`${semTutor} estagiário(s) sem tutor TEF`,'estagiarios']);
  if(semMeta)todo.push(['warn',`${semMeta} estagiário(s) sem horas exigidas definidas`,'estagiarios']);
  if(!S.horarios.length)todo.push(['warn','Ainda não há turnos de estágio no horário','horarios']);
  if(fSemTema)todo.push(['warn',`${fSemTema} formação(ões) sem tema ou formador`,'formacoes']);
  if(semEquip)todo.push(['acc',`${semEquip} estagiário(s) com equipamento por entregar`,'equipamentos']);
  const proxHTML=prox?(()=>{const d=pd(prox.data);return `<div class="next"><div class="datebox"><b>${d.getDate()}</b><span>${MES[d.getMonth()]}</span></div><div><div class="lab">Próxima formação · ${prox.n}.ª de ${S.form.length}</div><div class="t">${esc(prox.tema||'Tema por definir')}</div><div class="small muted">${esc(prox.formador||'Formador por definir')} · ${prox.ini?esc(prox.ini+'–'+prox.fim):fmtH(fDur(prox))}${prox.local?' · '+esc(prox.local):''}</div></div></div>`})():`<div class="panel">Todas as formações já foram realizadas.</div>`;
  const rows=S.est.map(e=>{
    const pres=S.form.filter(f=>formRealizada(f)&&f.pres[e.id]).length;
    const av=S.aval.filter(a=>a.estId===e.id).sort((a,b)=>(b.data||'').localeCompare(a.data||''))[0];
    return `<tr><td><b>${esc(e.nome)}</b></td><td>${e.local?`<span class="pill acc">${esc(e.local)}</span>`:'<span class="muted">—</span>'}</td><td>${esc(e.tutor)||'<span class="muted">—</span>'}</td><td>${progHTML(e)}</td><td class="num">${feitas?`${pres}/${feitas}`:'—'}</td><td class="num">${av?`<b>${n1(notaAval(av))}</b> <span class="muted small">${esc(av.momento)}</span>`:'<span class="muted">—</span>'}</td></tr>`}).join('');

V.estagiarios=()=>{

V.horarios=()=>{
  const w=UI.week,dias=[...Array(7)].map((_,i)=>addD(w,i));
  const plan={};
  const cols=dias.map(d=>{
    const sl=S.horarios.filter(s=>ativo(s,d)).sort((a,b)=>a.ini.localeCompare(b.ini));
    sl.forEach(s=>plan[s.estId]=(plan[s.estId]||0)+dur(s.ini,s.fim));
    const fs=S.form.filter(f=>f.data===d);
    const dt=pd(d);
    return `<div class="day${d===hoje()?' today':''}"><h4><span>${D3[dt.getDay()]}</span><span class="muted">${dt.getDate()} ${MES[dt.getMonth()]}</span></h4>
      ${fs.map(f=>`<div class="slot form"><b>Formação ${f.n}</b><span>${esc(f.tema||'Tema por definir')}</span></div>`).join('')}
      ${sl.map(s=>`<button class="slot" type="button" data-act="editSlot" data-id="${s.id}"><b>${esc(nomeEst(s.estId))}</b><span>${turnoCod(s)}${s.ini}–${s.fim}${s.local?' · '+esc(s.local):''}</span>${s.tutor?`<span class="muted">c/ ${esc(s.tutor)}</span>`:''}</button>`).join('')}
      ${!sl.length&&!fs.length?'<span class="empty">Sem turnos</span>':''}</div>`}).join('');
  const resumo=S.est.map(e=>`<tr><td>${esc(e.nome)}</td><td class="num">${plan[e.id]?fmtH(plan[e.id]):'<span class="muted">—</span>'}</td></tr>`).join('');
  return `<div class="bar-head"><h2 class="sec">Horários de estágio</h2><span class="sp"></span><button class="btn primary" type="button" data-act="editSlot">Adicionar turno</button></div>
  <div class="bar-head"><button class="btn sm" type="button" data-act="week" data-d="-7" aria-label="Semana anterior">‹</button><b>${fmtD(w)} – ${fmtD(addD(w,6))}</b><button class="btn sm" type="button" data-act="week" data-d="7" aria-label="Semana seguinte">›</button><button class="btn sm ghost" type="button" data-act="week" data-d="0">Esta semana</button><span class="sp"></span><button class="btn sm" type="button" data-act="copSemana">Copiar para a semana seguinte</button><button class="btn sm" type="button" data-act="genSemana">Registar horas desta semana</button></div>
  <div class="week">${cols}</div>
  <p class="small muted" style="margin:0">Cada turno repete-se no dia indicado dentro das datas de validade. Para turnos semanais, "Copiar para a semana seguinte" duplica os desta semana. "Registar horas desta semana" passa os turnos já cumpridos (até hoje) para o separador Horas, sem duplicar.</p>
  <div><h3>Horas planeadas nesta semana</h3><div class="tbl-wrap"><table><tbody>${resumo}</tbody></table></div></div>`;
};

V.avaliacao=()=>{

  const resumo=S.est.map(x=>{const g=m=>{const a=S.aval.filter(a=>a.estId===x.id&&a.momento===m).sort((a,b)=>(b.data||'').localeCompare(a.data||''))[0];return a?`<b>${n1(notaAval(a))}</b>`:'<span class="muted">—</span>'};return `<tr><td>${esc(x.nome)}</td><td class="num">${g('Intercalar')}</td><td class="num">${g('Final')}</td></tr>`}).join('');
  const avs=e?S.aval.filter(a=>a.estId===e.id).sort((a,b)=>(a.data||'').localeCompare(b.data||'')):[];
  const fichas=avs.map(a=>`<div class="panel" style="display:grid;gap:10px"><div class="bar-head"><span class="pill acc">${esc(a.momento)}</span><span class="small muted">${fmtDY(a.data)}${a.avaliador?' · '+esc(a.avaliador):''}</span><span class="sp"></span><span class="grade">${n1(notaAval(a))}<small> /20</small></span><button class="btn sm" type="button" data-act="editAval" data-id="${a.id}">Editar</button></div>
    <div class="crit">${S.criterios.map(c=>{const v=a.notas?.[c.id]||0;return `<span>${esc(c.nome)}${c.peso!==1?` <span class="muted small">×${String(c.peso).replace('.',',')}</span>`:''}</span><span class="dots" aria-label="${v} em 5">${[1,2,3,4,5].map(n=>`<i class="${n<=v?'on':''}"></i>`).join('')}</span>`}).join('')}</div>
    ${a.obs?`<p class="small" style="margin:0">${esc(a.obs)}</p>`:''}</div>`).join('');

  ${e?`<div class="bar-head"><h3 style="margin:0">${esc(e.nome)}</h3><span class="sp"></span><button class="btn primary" type="button" data-act="editAval" data-est="${e.id}">Nova avaliação</button></div>${fichas||'<div class="panel empty">Sem avaliações para este estagiário.</div>'}`:''}

  <div><h3>Resumo</h3><div class="tbl-wrap"><table><thead><tr><th>Estagiário</th><th class="num">Intercalar</th><th class="num">Final</th></tr></thead><tbody>${resumo}</tbody></table></div></div>`;

  <div class="panel"><h3>Casacos · pessoas por tamanho</h3>${sz('casaco')}<p class="small muted" style="margin:10px 0 0">${totC} entregue(s)</p></div></div>

/* ---------- modal e formulários ---------- */
let FC=null;
function showModal(html){$('#sheet').innerHTML=html;$('#modal').hidden=false;const f=$('#sheet').querySelector('input,select,textarea');if(f)f.focus()}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML='';FC=null}
function fieldHTML(f,v){
  const id='f_'+f.k,cls='fld'+(f.full?' full':'');
  if(f.t==='scale')return `<div class="${cls}"><span class="lab">${esc(f.l)}</span><div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="${id}" value="${n}"${Number(v)===n?' checked':''}><span>${n}</span></label>`).join('')}</div></div>`;
  let inp;
  if(f.t==='select')inp=`<select id="${id}">${f.opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}"${String(val)===String(v??'')?' selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
  else if(f.t==='textarea')inp=`<textarea id="${id}" rows="${f.rows||3}">${esc(v)}</textarea>`;
  else inp=`<input id="${id}" type="${f.t||'text'}" value="${esc(v)}"${f.step?` step="${f.step}"`:''}${f.min!=null?` min="${f.min}"`:''}>`;
  return `<div class="${cls}"><label for="${id}">${esc(f.l)}</label>${inp}</div>`;
}
function openForm(title,fields,vals,onSave,onDelete){
  FC={fields,onSave,onDelete};
  showModal(`<h2>${esc(title)}</h2><form id="fm" class="fgrid" novalidate>${fields.map(f=>fieldHTML(f,vals[f.k])).join('')}<p class="ferr" id="ferr" hidden></p><div class="factions">${onDelete?'<button type="button" class="btn danger" data-act="fdel">Apagar</button>':''}<span class="sp"></span><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`);
  $('#fm').addEventListener('submit',ev=>{ev.preventDefault();const v={};FC.fields.forEach(f=>{const id='f_'+f.k;if(f.t==='scale'){const c=document.querySelector(`input[name="${id}"]:checked`);v[f.k]=c?Number(c.value):null}else{let x=document.getElementById(id).value;if(f.t==='number')x=x===''?null:Number(x);v[f.k]=typeof x==='string'?x.trim():x}});
    const err=FC.onSave(v);if(err){const p=$('#ferr');p.textContent=err;p.hidden=false;return}save();closeModal();render()});
}
const optTut=()=>[['','—'],...S.tutores.map(t=>[t,t])];
const optEst=()=>S.est.map(e=>[e.id,e.nome]);
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}

const A={};
A.tab=el=>{UI.tab=el.dataset.k;try{localStorage.setItem(KEY+'_tab',UI.tab)}catch(e){}render();window.scrollTo(0,0)};
A.close=()=>closeModal();
A.fdel=el=>{if(!el.dataset.armed){el.dataset.armed=1;el.textContent='Confirmar apagar';return}FC.onDelete();save();closeModal();render();toast('Apagado')};
A.editEst=el=>{

    {k:'nome',l:'Nome curto',full:1},{k:'nomeCompleto',l:'Nome completo',full:1},
    {k:'tel',l:'Telemóvel',t:'tel'},{k:'email',l:'Email',t:'email'},{k:'nascimento',l:'Data de nascimento',t:'date'},{k:'escola',l:'Escola / curso'},
    {k:'morada',l:'Morada',full:1},{k:'cp',l:'Código postal'},{k:'emNome',l:'Emergência: nome'},{k:'emParent',l:'Emergência: parentesco'},{k:'emTel',l:'Emergência: telemóvel',t:'tel'},
    {k:'local',l:'Local',t:'select',opts:[['','—'],'PNF','LSD']},{k:'tutor',l:'Tutor TEF',t:'select',opts:tut},
    {k:'horasReq',l:'Horas exigidas',t:'number',min:0},{k:'inicio',l:'Início do estágio',t:'date'},{k:'fim',l:'Fim do estágio',t:'date'},
    {k:'tshirt',l:'Tamanho t-shirt',t:'select',opts:TAM},{k:'casaco',l:'Tamanho casaco',t:'select',opts:TAM},
    {k:'notas',l:'Notas',t:'textarea',full:1}],
    e||{tshirt:'M',casaco:'M'},
    v=>{if(!v.nome)return 'Indica o nome do estagiário.';if(e)Object.assign(e,v);else S.est.push({id:uid(),entT:0,entC:0,entData:'',...v})},
    e?()=>{S.est=S.est.filter(x=>x.id!==e.id);S.horarios=S.horarios.filter(s=>s.estId!==e.id);S.registos=S.registos.filter(r=>r.estId!==e.id);S.aval=S.aval.filter(a=>a.estId!==e.id);S.form.forEach(f=>delete f.pres[e.id])}:null);
};
A.addTutor=()=>{const i=$('#novoTutor'),v=i.value.trim();if(!v)return;if(!S.tutores.includes(v))S.tutores.push(v);save();render();toast('Tutor adicionado')};
A.delTutor=el=>{S.tutores.splice(Number(el.dataset.i),1);save();render()};
A.week=el=>{const d=Number(el.dataset.d);UI.week=d?addD(UI.week,d):segunda(hoje());render()};
A.editSlot=el=>{
  if(!S.est.length){toast('Adiciona primeiro um estagiário');return}
  const s=el.dataset.id?S.horarios.find(x=>x.id===el.dataset.id):null;
  const tut=optTut();if(s?.tutor&&!S.tutores.includes(s.tutor))tut.push([s.tutor,s.tutor]);
  openForm(s?'Editar turno':'Novo turno',[
    {k:'estId',l:'Estagiário',t:'select',opts:optEst(),full:1},
    {k:'dia',l:'Dia da semana',t:'select',opts:[1,2,3,4,5,6,0].map(d=>[d,DIAS[d]])},{k:'local',l:'Local',t:'select',opts:[['','—'],'PNF','LSD']},
    {k:'ini',l:'Entrada',t:'time'},{k:'fim',l:'Saída',t:'time'},
    {k:'tutor',l:'TEF de turno (tutor)',t:'select',opts:tut,full:1},
    {k:'de',l:'Válido de',t:'date'},{k:'ate',l:'Válido até',t:'date'}],
    s||{estId:S.est[0].id,dia:pd(UI.week).getDay(),ini:'09:00',fim:'13:00',de:UI.week,local:''},
    v=>{v.dia=Number(v.dia);if(!v.ini||!v.fim||mins(v.fim)<=mins(v.ini))return 'A saída tem de ser depois da entrada.';
      if(!s&&!v.local){const e=estById(v.estId);if(e?.local)v.local=e.local}
      if(!s&&!v.tutor){const e=estById(v.estId);if(e?.tutor)v.tutor=e.tutor}
      if(s)Object.assign(s,v);else S.horarios.push({id:uid(),...v})},
    s?()=>{S.horarios=S.horarios.filter(x=>x.id!==s.id)}:null);
};
A.copSemana=()=>{
  let n=0;const nw=addD(UI.week,7);
  for(let i=0;i<7;i++){const d=addD(UI.week,i),d2=addD(d,7);
    S.horarios.filter(s=>ativo(s,d)&&!ativo(s,d2)).forEach(s=>{if(!S.horarios.some(x=>x.estId===s.estId&&x.ini===s.ini&&ativo(x,d2))){S.horarios.push({...s,id:uid(),de:nw,ate:addD(nw,6)});n++}})}
  save();UI.week=nw;render();toast(n?`${n} turno(s) copiado(s) para a semana seguinte`:'A semana seguinte já tem estes turnos');
};
A.genSemana=()=>{
  let n=0;const lim=hoje();
  for(let i=0;i<7;i++){const d=addD(UI.week,i);if(d>lim)break;
    S.horarios.filter(s=>ativo(s,d)).forEach(s=>{if(!S.registos.some(r=>r.estId===s.estId&&r.data===d&&r.ini===s.ini)){S.registos.push({id:uid(),estId:s.estId,data:d,ini:s.ini,fim:s.fim,tipo:'Sala',nota:'Do horário'});n++}})}
  save();render();toast(n?`${n} registo(s) criado(s)`:'Nada novo a registar nesta semana');
};
A.editReg=el=>{
  if(!S.est.length){toast('Adiciona primeiro um estagiário');return}
  const r=el.dataset.id?S.registos.find(x=>x.id===el.dataset.id):null;
  openForm(r?'Editar registo':'Registar horas',[
    {k:'estId',l:'Estagiário',t:'select',opts:optEst(),full:1},{k:'data',l:'Data',t:'date',full:1},
    {k:'ini',l:'Entrada',t:'time'},{k:'fim',l:'Saída',t:'time'},
    {k:'tipo',l:'Tipo',t:'select',opts:['Sala','Aula de grupo','Avaliação física','Outro']},{k:'nota',l:'Nota'}],
    r||{estId:UI.hEst||S.est[0].id,data:hoje(),ini:'09:00',fim:'13:00',tipo:'Sala'},
    v=>{if(!v.data)return 'Indica a data.';if(!v.ini||!v.fim||mins(v.fim)<=mins(v.ini))return 'A saída tem de ser depois da entrada.';if(r)Object.assign(r,v);else S.registos.push({id:uid(),...v})},
    r?()=>{S.registos=S.registos.filter(x=>x.id!==r.id)}:null);
};
A.fToggle=el=>{UI.fOpen=UI.fOpen===el.dataset.id?null:el.dataset.id;render()};
A.presTodos=el=>{const f=S.form.find(x=>x.id===el.dataset.id);S.est.forEach(e=>f.pres[e.id]=true);save();render()};
A.editForm=el=>{
  const f=el.dataset.id?S.form.find(x=>x.id===el.dataset.id):null;
  openForm(f?`Formação ${f.n}`:'Nova formação',[
    {k:'data',l:'Data',t:'date'},{k:'duracao',l:'Duração (horas)',t:'number',step:'0.5',min:0},
    {k:'ini',l:'Início',t:'time'},{k:'fim',l:'Fim',t:'time'},
    {k:'tema',l:'Tema',full:1},{k:'formador',l:'Formador'},{k:'local',l:'Local'},
    {k:'sumario',l:'Sumário',t:'textarea',full:1,rows:4}],
    f||{data:'',duracao:2},
    v=>{if(!v.data)return 'Indica a data.';if(v.ini&&v.fim){if(mins(v.fim)<=mins(v.ini))return 'O fim tem de ser depois do início.';v.duracao=dur(v.ini,v.fim)/60}
      if(f)Object.assign(f,v);else S.form.push({id:uid(),pres:{},...v});
      S.form.sort((a,b)=>a.data.localeCompare(b.data)).forEach((x,i)=>x.n=i+1)},
    f?()=>{S.form=S.form.filter(x=>x.id!==f.id);S.form.forEach((x,i)=>x.n=i+1)}:null);
};
A.aEst=el=>{UI.aEst=el.dataset.id;render()};
A.editAval=el=>{
  const a=el.dataset.id?S.aval.find(x=>x.id===el.dataset.id):null;
  const estId=a?a.estId:el.dataset.est;
  const vals=a?{momento:a.momento,data:a.data,avaliador:a.avaliador,obs:a.obs,...Object.fromEntries(S.criterios.map(c=>['c_'+c.id,a.notas?.[c.id]]))}:{momento:S.aval.some(x=>x.estId===estId&&x.momento==='Intercalar')?'Final':'Intercalar',data:hoje(),avaliador:estById(estId)?.tutor||''};
  openForm(`Avaliação · ${nomeEst(estId)}`,[
    {k:'momento',l:'Momento',t:'select',opts:['Intercalar','Final']},{k:'data',l:'Data',t:'date'},
    {k:'avaliador',l:'Avaliador',full:1},
    ...S.criterios.map(c=>({k:'c_'+c.id,l:c.nome,t:'scale',full:1})),
    {k:'obs',l:'Observações',t:'textarea',full:1}],
    vals,
    v=>{const notas={};S.criterios.forEach(c=>{if(v['c_'+c.id])notas[c.id]=v['c_'+c.id]});if(!Object.keys(notas).length)return 'Avalia pelo menos um critério.';
      const o={momento:v.momento,data:v.data,avaliador:v.avaliador,obs:v.obs,notas};if(a)Object.assign(a,o);else S.aval.push({id:uid(),estId,...o})},
    a?()=>{S.aval=S.aval.filter(x=>x.id!==a.id)}:null);
};
A.editCrit=()=>{
  const txt=S.criterios.map(c=>`${c.nome} | ${String(c.peso).replace('.',',')}`).join('\n');
  openForm('Critérios de avaliação',[{k:'txt',l:'Um critério por linha: nome | peso',t:'textarea',full:1,rows:10}],{txt},
    v=>{const linhas=v.txt.split('\n').map(l=>l.trim()).filter(Boolean);if(!linhas.length)return 'Indica pelo menos um critério.';
      S.criterios=linhas.map(l=>{const[nome,p]=l.split('|').map(x=>x.trim());const peso=Number((p||'1').replace(',','.'))||1;const ex=S.criterios.find(c=>c.nome===nome);return {id:ex?ex.id:uid(),nome,peso}})});
};
A.dados=()=>{
  const json=JSON.stringify(S,null,1);
  showModal(`<h2>Dados</h2><p class="small muted" style="margin:0">Os dados ficam guardados neste browser. Exporta-os para ter uma cópia de segurança ou para passar para outro computador.</p>
  <div class="fld"><label for="expTxt">Exportar (JSON)</label><textarea id="expTxt" rows="6" readonly>${esc(json)}</textarea></div>
  <div class="inline"><button class="btn" type="button" data-act="copiar">Copiar</button><button class="btn" type="button" data-act="baixar">Descarregar ficheiro</button></div>
  <div class="fld"><label for="impTxt">Importar: cola o JSON ou escolhe um ficheiro</label><textarea id="impTxt" rows="4"></textarea><input type="file" id="impFile" accept=".json,application/json" data-chg="impFile"></div>
  <p class="ferr" id="ferr" hidden></p>
  <div class="factions"><button class="btn danger" type="button" data-act="repor">Repor dados iniciais</button><span class="sp"></span><button class="btn ghost" type="button" data-act="close">Fechar</button><button class="btn primary" type="button" data-act="importar">Importar</button></div>`);
};
A.copiar=()=>{const t=$('#expTxt');navigator.clipboard?.writeText(t.value).then(()=>toast('Copiado'),()=>{t.select();toast('Seleccionado: usa Ctrl+C')})??(t.select(),toast('Seleccionado: usa Ctrl+C'))};
A.baixar=()=>{try{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`estagios_${hoje()}.json`;document.body.appendChild(a);a.click();a.remove();toast('Ficheiro descarregado')}catch(e){toast('Não foi possível descarregar; usa Copiar')}};
A.importar=()=>{const p=$('#ferr');try{const o=JSON.parse($('#impTxt').value);if(!o||!Array.isArray(o.est)||!Array.isArray(o.form))throw 0;S=Object.assign(seed(),o);save();closeModal();render();toast('Dados importados')}catch(e){p.textContent='O texto não é uma exportação válida desta app.';p.hidden=false}};
A.repor=el=>{if(!el.dataset.armed){el.dataset.armed=1;el.textContent='Confirmar: apagar tudo';return}S=seed();save();closeModal();render();toast('Dados repostos')};

const C={};
C.hEst=el=>{UI.hEst=el.value;render()};
C.pres=el=>{const f=S.form.find(x=>x.id===el.dataset.f);if(el.checked)f.pres[el.dataset.e]=true;else delete f.pres[el.dataset.e];save();render()};
C.eq=el=>{const e=estById(el.dataset.id),k=el.dataset.k;e[k]=el.type==='number'?Math.max(0,Number(el.value)||0):el.value;if((k==='entT'||k==='entC')&&e[k]>0&&!e.entData)e.entData=hoje();save();render();toast('Gravado')};
C.impFile=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#impTxt').value=r.result};r.readAsText(f)};

document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(el&&A[el.dataset.act]){A[el.dataset.act](el,ev)}else if(ev.target.id==='modal')closeModal()});
document.addEventListener('change',ev=>{const el=ev.target.closest('[data-chg]');if(el&&C[el.dataset.chg])C[el.dataset.chg](el)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#modal').hidden)closeModal();if(ev.key==='Enter'&&ev.target.id==='novoTutor')A.addTutor()});
render();
</script>

</body>
</html>
