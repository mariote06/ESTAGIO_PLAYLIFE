<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A6C96">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Estágios Playlife</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho de clube + barra de separadores fixa; cada separador é uma folha da "caderneta de estágio" */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E3E8ED; --ink:#15202B; --muted:#5A6774; --line:#D3DAE1;
  --accent:#0A6C96; --accent-ink:#FFFFFF; --accent-soft:#D9ECF5;
  --ok:#2C7A4B; --ok-soft:#DCEFE3; --warn:#9A5A00; --warn-soft:#F7E8CF; --bad:#B3261E; --bad-soft:#F7DEDB;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#17202A; --sunk:#111920; --ink:#E5ECF2; --muted:#93A1AE; --line:#29353F;
  --accent:#53B4DF; --accent-ink:#04202D; --accent-soft:#123142;
  --ok:#62C48D; --ok-soft:#14301F; --warn:#E3A548; --warn-soft:#352610; --bad:#F2877F; --bad-soft:#3A1715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#17202A; --sunk:#111920; --ink:#E5ECF2; --muted:#93A1AE; --line:#29353F;
  --accent:#53B4DF; --accent-ink:#04202D; --accent-soft:#123142;
  --ok:#62C48D; --ok-soft:#14301F; --warn:#E3A548; --warn-soft:#352610; --bad:#F2877F; --bad-soft:#3A1715; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:14px 10px}
#hdrBtns{flex-wrap:wrap;align-items:center;justify-content:flex-end}
.brand{min-width:200px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:10px 12px 9px;border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.seg button:focus-visible,.nm-btn:focus-visible,.add-btn:focus-visible,.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:18px 60px;display:grid;gap:18px}
h2.sec{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}
.bar-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bar-head .sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{font:inherit;font-weight:500;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:32px;font-weight:700;line-height:1}
.stat span{color:var(--muted);font-size:13px}
.next{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:14px}
.datebox{background:var(--accent);color:var(--accent-ink);border-radius:8px;text-align:center;padding:6px 12px;font-family:var(--display);line-height:1}
.datebox b{display:block;font-size:30px}
.datebox span{font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.next .lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.next .t{font-weight:600;font-size:16px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--display);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.prog{display:flex;align-items:center;gap:8px;min-width:150px}
.track{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.track i.done{background:var(--ok)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.todo{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:10px;align-items:baseline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.card .nm{font-weight:600;font-size:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 6px 4px 12px;font-size:14px}
.chip button{border:0;background:var(--sunk);color:var(--muted);border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:14px;line-height:1}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:5px 12px;cursor:pointer}
button.chip{cursor:pointer;padding:5px 12px;font:inherit;font-size:14px;color:var(--ink)}
.inline{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day h4{margin:0;font-family:var(--display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between}
.slot{text-align:left;font:inherit;font-size:13px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--sunk);color:var(--ink);border-radius:6px;padding:5px 7px;cursor:pointer;display:grid;gap:1px}
.slot b{font-weight:600}
.slot.form{border-left-color:var(--warn);background:var(--warn-soft);cursor:default}
.empty{color:var(--muted);font-size:13px}
.row-btn{width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.fnum{font-family:var(--display);font-weight:700;font-size:26px;color:var(--muted);text-align:center;line-height:1}
.fitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.fitem.past .fnum{color:var(--accent)}
.fbody{border-top:1px solid var(--line);margin-top:10px;padding-top:12px;display:grid;gap:12px}
.pres{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.presrow{display:flex;gap:6px;align-items:center}.presrow label{flex:1;min-width:0}.presrow select{padding:4px 6px;font-size:13px}
.pres label{display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.pres input{width:18px;height:18px;accent-color:var(--accent)}
.grade{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.grade small{font-size:14px;color:var(--muted);font-weight:500}
.crit{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;align-items:center}
.dots{display:flex;gap:3px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--sunk)}
.dots i.on{background:var(--accent)}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.size{border:1px solid var(--line);border-radius:8px;text-align:center;padding:8px 4px;background:var(--surface)}
.size b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.size span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td select,td input{padding:4px 6px;font-size:14px}
td input[type=number]{width:64px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:3px;justify-self:start}
.seg button{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.03em;border:0;background:none;color:var(--muted);padding:7px 16px;border-radius:7px;cursor:pointer;display:flex;gap:8px;align-items:center}
.seg button span{font-family:var(--body);font-size:12px;background:var(--surface);color:var(--muted);border-radius:10px;padding:1px 7px}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-selected="true"] span{background:var(--accent-ink);color:var(--accent)}
.grade-t{min-width:760px;table-layout:fixed}
.grade-t th{text-align:center;padding:8px 4px;font-size:13px}
.grade-t th.tc{width:44px;font-size:18px;color:var(--accent);background:var(--sunk)}
.grade-t th.hj{color:var(--accent)}
.grade-t td{border-left:1px solid var(--line);padding:6px;vertical-align:top}
.grade-t td.off{background:var(--sunk)}
.grade-t td.hj{background:var(--accent-soft)}
.cell{display:table-cell}
.cell .hr{display:block;font-size:11px;color:var(--muted);text-align:center;margin-bottom:4px}
.nm-btn{display:block;width:100%;font:inherit;font-size:12px;font-weight:600;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:5px;padding:3px 5px;margin-bottom:3px;color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add-btn{display:block;width:100%;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:5px;font-size:15px;line-height:1;padding:3px 0;cursor:pointer}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}
.warnp{border-color:var(--warn);background:var(--warn-soft)}
.loclist li{align-items:center;flex-wrap:wrap}
.loclist .sp{flex:1}
body[data-modo="aluno"] main .wrap{padding-block:14px 100px;max-width:720px}
body[data-modo="pick"] main .wrap{max-width:560px}
.alnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.alnav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;cursor:pointer}
.alnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.alnav button[aria-current="true"]{color:var(--accent);font-weight:600}
.alnav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.shifts{display:grid;gap:6px;margin-bottom:10px}
.shift{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;text-align:left;font:inherit;color:inherit;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;width:100%}
.shift:focus-visible,.secbtn:focus-visible,.fi-h:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shift .sd b{display:block;font-family:var(--display);font-size:18px;text-transform:uppercase;line-height:1}
.shift .sd small,.shift .sm small{display:block;color:var(--muted);font-size:12px}
.shift .sm{min-width:0;font-size:14px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.kpi b{display:block;font-family:var(--display);font-size:36px;line-height:1.05}
.kpi small{display:block;font-size:13px}
.kpi .lab,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.lbl{margin:12px 0 5px}
.track.lg{height:12px;border-radius:6px}
.tefbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:var(--r);padding:8px 12px;font-size:14px}
.secs{display:grid;gap:8px}
.secbtn{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.secbtn .n{font-family:var(--display);font-weight:700;font-size:24px;color:var(--muted);text-align:center}
.secbtn .prog,.row-btn .prog{min-width:0;margin-top:4px}
.dsec{display:grid;gap:8px}
.leit{max-width:65ch;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px 8px}
.leit h4{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em;margin:14px 0 4px}
.leit p{margin:0 0 9px}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.chk input,.mini input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.rlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 12px 6px}
.rg{font-family:var(--display);font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin:14px 0 2px}
.ritem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ritem:last-child{border-bottom:0}
.ritem.done>span:first-child{color:var(--muted)}
.rcols{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mini{display:inline-flex;gap:5px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.mini.pt{color:var(--warn);font-weight:600}
.fi{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.fi.done{border-left:3px solid var(--ok)}
.fi-h{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;font:inherit;color:inherit;background:none;border:0;padding:11px 12px;text-align:left;cursor:pointer}
.fi-b{display:grid;gap:8px;padding:0 12px 12px}
.tefbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:10px 12px}
.tefbox p{margin:2px 0 8px}
.pick{display:grid;gap:14px}
.pick-list{display:grid;gap:8px}
.pick-list .btn{text-align:left;padding:12px 14px;font-size:15px}
.rel .fgrid{margin-top:8px}
.grade-t.al{min-width:0;font-size:10px}
.grade-t.al th{font-size:11px;padding:6px 1px}
.grade-t.al th.tc{width:28px;font-size:14px}
.grade-t.al td{padding:4px 1px;text-align:center}
.grade-t.al .hr{font-size:10px;margin:0}
.grade-t td.me{background:var(--accent);color:var(--accent-ink)}
.grade-t td.me .hr{color:var(--accent-ink)}
.loc{font-size:10px;display:block;letter-spacing:.04em}
@media (max-width:420px){.ritem{grid-template-columns:1fr}.rcols{justify-content:flex-start}}
/* ===== Estagiário: telemóvel (base), tablet e PC ===== */
.al-grid{display:grid;gap:14px;align-items:start}
.al-col{display:grid;gap:14px;align-content:start;min-width:0}
.al-brand{display:none}
.al-wide-only{display:none}
.doslist{display:none}
.dl-it{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;border-radius:6px;padding:7px 8px;cursor:pointer}
.dl-it small{color:var(--muted);font-variant-numeric:tabular-nums}
.dl-it:hover{background:var(--sunk)}
.dl-it.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dl-it:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dos-main{display:grid;gap:12px;min-width:0}
.pres-g .al-side{order:0}
@media (min-width:700px){
  body[data-modo="aluno"] main .wrap{max-width:1000px;padding-block:20px 104px}
  .alnav{justify-content:center}
  .alnav button{flex:0 1 150px;flex-direction:row;gap:8px;font-size:14px;padding:12px 8px}
  .al-grid{grid-template-columns:1fr 1fr}
  .dos-ov{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
  .pres-g{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
  .pres-g .stats{grid-template-columns:1fr 1fr 1fr}
  .secs.al-col{grid-template-columns:1fr 1fr;gap:8px}
  .grade-t.al{font-size:12px}
  .grade-t.al th{font-size:13px;padding:8px 2px}
  .grade-t.al th.tc{width:40px;font-size:16px}
  .grade-t.al .hr{font-size:12px}
  .grade-t.al td{padding:8px 2px}
  .loc{font-size:12px}
  .fi-b{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .fi-b .rcols{grid-column:1/-1}
  .kpi b{font-size:44px}
  .shift{grid-template-columns:56px 1fr auto}
}
@media (min-width:1100px){
  body[data-modo="aluno"] header.top{display:none}
  body[data-modo="aluno"]::before{background:var(--bg)}
  body[data-modo="aluno"] main{margin-left:236px}
  body[data-modo="aluno"] main .wrap{max-width:1180px;padding-block:28px 48px}
  .alnav{top:0;bottom:0;right:auto;width:236px;flex-direction:column;justify-content:flex-start;gap:2px;border-top:0;border-right:1px solid var(--line);padding:max(20px,env(safe-area-inset-top,0px)) 12px 20px max(12px,env(safe-area-inset-left,0px))}
  .alnav .al-brand{display:grid;gap:3px;padding:4px 10px 18px;margin-bottom:8px;border-bottom:1px solid var(--line)}

  function pd(s){var a=String(s).split('-');return new Date(+a[0],+a[1]-1,+a[2])}

    var e=(cfg.est||[]).filter(function(x){return x.id===id})[0]||{};
    if(e.fim&&e.fim<W)return {slots:[],origem:'fim'};
    if(e.inicio&&e.inicio>add(W,6))return {slots:[],origem:'inicio'};
    var dc=((cfg.decisoes||{})[id]||{})[W];if(dc&&dc.vazia)return {slots:[],origem:'vazia'};
    var r=reais(cfg.horarios,id,W);

    else{var s=semana(cfg,e.id,W);out[e.id]={estado:s.origem,slots:s.slots,de:s.de}}});return out}

})();

function parseMapa(txt){const out=[];String(txt||'').split('\n').forEach(l=>{const p=l.split(';').map(x=>x.trim());if(p.length<4)return;const dia=DSIG.findIndex(d=>d.toLowerCase()===p[0].toLowerCase().replace('sab','sáb'));if(dia<0||!/^\d{1,2}:\d{2}$/.test(p[1])||!/^\d{1,2}:\d{2}$/.test(p[2]))return;const z=t=>t.padStart(5,'0');out.push({dia,ini:z(p[1]),fim:z(p[2]),aula:p.slice(3).join(';')})});return out.sort((a,b)=>((a.dia+6)%7)-((b.dia+6)%7)||a.ini.localeCompare(b.ini))}

/* Horas sem sobreposição: formação > aula de grupo > turno de sala, minuto a minuto em cada dia */
function contaHoras(items){
  const dias={},out={form:0,aulas:0,sala:0,extra:0};const NV={form:3,aula:2,sala:1};
  items.forEach(it=>{const a=mins(it.ini),b=mins(it.fim);if(!it.date||!it.ini||!it.fim||b<=a){out.extra+=it.min||0;if(it.min)out[it.cat==='aula'?'aulas':it.cat]+=it.min;return}
    const d=dias[it.date]=dias[it.date]||new Uint8Array(1440);const v=NV[it.cat]||1;for(let m=a;m<b&&m<1440;m++)if(d[m]<v)d[m]=v});
  Object.values(dias).forEach(d=>{for(let m=0;m<1440;m++){if(d[m]===3)out.form++;else if(d[m]===2)out.aulas++;else if(d[m]===1)out.sala++}});
  out.total=out.form+out.aulas+out.sala;return out;
}
function fItem(f,ap){const ini=(ap&&ap.ini)||f.ini,fim=(ap&&ap.fim)||f.fim;return {date:f.data,ini,fim,cat:'form',min:(ini&&fim)?0:fDur(f)}}
function horasEst(id){
  const its=[];let app=0,pend=0;
  S.registos.filter(r=>r.estId===id).forEach(r=>its.push({date:r.data,ini:r.ini,fim:r.fim,cat:r.tipo==='Aula de grupo'?'aula':'sala'}));
  Object.values(S.recebidos?.[id]?.reg||{}).forEach(r=>{if(r.falta)return;const m=dur(r.start,r.end);if(!r.tef){pend+=m;return}app+=m;its.push({date:r.date,ini:r.start,fim:r.end,cat:r.tipo==='aula'?'aula':'sala'})});
  S.form.filter(f=>presF(f,id)).forEach(f=>its.push(fItem(f,fpApp(f,id))));
  const h=contaHoras(its),ant=Math.round((Number(estById(id)?.horasAnt)||0)*60);
  return {sala:h.sala,aulas:h.aulas,form:h.form,ant,app,pend,total:h.total+ant};
}
function notaAval(a){let s=0,w=0;S.criterios.forEach(c=>{const v=a.notas?.[c.id];if(v){s+=v*c.peso;w+=c.peso}});return w?Math.round(s/w/5*200)/10:null}
const ativo=(s,date)=>s.dia===pd(date).getDay()&&(!s.de||s.de<=date)&&(!s.ate||s.ate>=date);
const formRealizada=f=>f.data<=hoje();
const fpApp=(f,id)=>((S.recebidos?.[id]?.formPres)||{})[f.id]||null;
const presF=(f,id)=>!!(f.pres[id]||fpApp(f,id));
const notaF=(f,id)=>{const m=(f.notas||{})[id];if(m!=null&&m!=='')return m;const a=fpApp(f,id);return a?(a.aval!=null?a.aval:null):null};
function progHTML(e){

}

V.horas=()=>{
  const f=UI.hEst;
  const regs=S.registos.filter(r=>!f||r.estId===f).sort((a,b)=>(b.data+b.ini).localeCompare(a.data+a.ini));
  const resumo=EV().map(e=>{const h=horasEst(e.id);return `<tr><td>${esc(e.nome)}</td><td class="num">${h.ant?fmtH(h.ant):'—'}</td><td class="num">${fmtH(h.sala)}</td><td class="num">${h.aulas?fmtH(h.aulas):'—'}</td><td class="num">${fmtH(h.form)}</td><td class="num">${h.pend?`<span class="pill warn">${fmtH(h.pend)}</span>`:'—'}</td><td>${progHTML(e)}</td></tr>`}).join('');
  const appRows=EV().filter(e=>!f||e.id===f).flatMap(e=>regsApp(e.id).map(r=>({k:r.date+r.ini,h:`<tr><td>${fmtD(r.date)}</td><td>${esc(e.nome)}${r.tipo==='aula'?`<small class="muted" style="display:block">Aula · ${esc(r.aula||'')}${r.papel?' ('+esc(r.papel.toLowerCase())+')':''}</small>`:''}</td><td>${r.start}–${r.end}</td><td class="num">${r.falta?'—':fmtH(dur(r.start,r.end))}</td><td>${r.falta?'<span class="pill bad">Falta</span>':r.tef?`<span class="pill ok">Confirmado</span> <span class="small muted">${esc(r.tef)}</span>${r.aval!=null?` <span class="pill acc">${String(r.aval).replace('.',',')}/20</span>`:''}`:'<span class="pill warn">Por confirmar</span>'}${r.nota?` <span class="small muted">${esc(r.nota)}</span>`:''}</td><td class="num"><span class="small muted">app</span></td></tr>`})));
  const lista0=regs.map(r=>({k:r.data+r.ini,h:`<tr><td>${fmtD(r.data)}</td><td>${esc(nomeEst(r.estId))}</td><td>${r.ini}–${r.fim}</td><td class="num">${fmtH(dur(r.ini,r.fim))}</td><td><span class="pill">${esc(r.tipo)}</span>${r.nota?` <span class="small muted">${esc(r.nota)}</span>`:''}</td><td class="num"><button class="btn sm" type="button" data-act="editReg" data-id="${r.id}">Editar</button></td></tr>`}));
  const antRows=EV().filter(e=>(!f||e.id===f)&&Number(e.horasAnt)>0).map(e=>({k:(e.horasAntAte||e.inicio||'0000')+'00:00',h:`<tr><td>${e.horasAntAte?'até '+fmtD(e.horasAntAte):'—'}</td><td>${esc(e.nome)}</td><td>—</td><td class="num">${fmtH(Math.round(Number(e.horasAnt)*60))}</td><td><span class="pill">Antes da app</span>${e.horasAntNota?` <span class="small muted">${esc(e.horasAntNota)}</span>`:''}</td><td class="num"><button class="btn sm" type="button" data-act="horasAnt" data-id="${e.id}">Editar</button></td></tr>`}));
  const lista=[...lista0,...appRows,...antRows].sort((a,b)=>b.k.localeCompare(a.k)).map(x=>x.h).join('');

V.avaliacao=()=>{
  const sel=UI.aEst||EV()[0]?.id||'';
  const e=estById(sel);
  const resumo=EV().map(x=>{const g=m=>{const a=S.aval.filter(a=>a.estId===x.id&&a.momento===m).sort((a,b)=>(b.data||'').localeCompare(a.data||''))[0];return a?`<b>${n1(notaAval(a))}</b>`:'<span class="muted">—</span>'};const ns=S.form.map(f=>notaF(f,x.id)).filter(v=>v!=null&&v!=='');const rs=regsApp(x.id).filter(r=>r.tef&&r.aval!=null);const mt=v=>v.length?n1(v.reduce((a,b)=>a+Number(b),0)/v.length):null;const tu=mt(rs.filter(r=>r.tipo!=='aula').map(r=>r.aval)),au=mt(rs.filter(r=>r.tipo==='aula').map(r=>r.aval));return `<tr><td>${esc(x.nome)}</td><td class="num">${tu!=null?tu:'<span class="muted">—</span>'}</td><td class="num">${au!=null?au:'<span class="muted">—</span>'}</td><td class="num">${ns.length?n1(ns.reduce((a,b)=>a+Number(b),0)/ns.length)+' <span class="small muted">('+ns.length+')</span>':'<span class="muted">—</span>'}</td><td class="num">${g('Intercalar')}</td><td class="num">${g('Final')}</td></tr>`}).join('');
  const avs=e?S.aval.filter(a=>a.estId===e.id).sort((a,b)=>(a.data||'').localeCompare(b.data||'')):[];
  const fichas=avs.map(a=>`<div class="panel" style="display:grid;gap:10px"><div class="bar-head"><span class="pill acc">${esc(a.momento)}</span><span class="small muted">${fmtDY(a.data)}${a.avaliador?' · '+esc(a.avaliador):''}</span><span class="sp"></span><span class="grade">${n1(notaAval(a))}<small> /20</small></span><button class="btn sm" type="button" data-act="editAval" data-id="${a.id}">Editar</button></div>
    <div class="crit">${S.criterios.map(c=>{const v=a.notas?.[c.id]||0;return `<span>${esc(c.nome)}${c.peso!==1?` <span class="muted small">×${String(c.peso).replace('.',',')}</span>`:''}</span><span class="dots" aria-label="${v} em 5">${[1,2,3,4,5].map(n=>`<i class="${n<=v?'on':''}"></i>`).join('')}</span>`}).join('')}</div>
    ${a.obs?`<p class="small" style="margin:0">${esc(a.obs)}</p>`:''}</div>`).join('');
  return `<div class="bar-head"><h2 class="sec">Avaliação</h2><span class="sp"></span><button class="btn" type="button" data-act="editCrit">Critérios</button></div>
  <div class="chips">${EV().map(x=>`<button type="button" class="chip${x.id===sel?' sel':''}" data-act="aEst" data-id="${x.id}">${esc(x.nome)}</button>`).join('')}</div>
  ${e?`<div class="bar-head"><h3 style="margin:0">${esc(e.nome)}</h3><span class="sp"></span><button class="btn primary" type="button" data-act="editAval" data-est="${e.id}">Nova avaliação</button></div>${fichas||'<div class="panel empty">Sem avaliações para este estagiário.</div>'}`:''}
  <p class="small muted" style="margin:0">Cada critério vale de 1 a 5. A nota final é a média ponderada convertida para a escala 0–20.</p>
  <div><h3>Resumo</h3><div class="tbl-wrap"><table><thead><tr><th>Estagiário</th><th class="num">Turnos (0–20)</th><th class="num">Aulas (0–20)</th><th class="num">Formações (0–20)</th><th class="num">Intercalar</th><th class="num">Final</th></tr></thead><tbody>${resumo}</tbody></table></div></div>`;
};

/* ---------- modal e formulários ---------- */
let FC=null;
function showModal(html){$('#sheet').innerHTML=html;$('#modal').hidden=false;const f=$('#sheet').querySelector('input,select,textarea');if(f)f.focus()}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML='';$('#sheet').classList.remove('sheet-tut');FC=null}
function fieldHTML(f,v){
  const id='f_'+f.k,cls='fld'+(f.full?' full':'');
  if(f.t==='scale')return `<div class="${cls}"><span class="lab">${esc(f.l)}</span><div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="${id}" value="${n}"${Number(v)===n?' checked':''}><span>${n}</span></label>`).join('')}</div></div>`;
  let inp;
  if(f.t==='select')inp=`<select id="${id}">${f.opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}"${String(val)===String(v??'')?' selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
  else if(f.t==='textarea')inp=`<textarea id="${id}" rows="${f.rows||3}">${esc(v)}</textarea>`;
  else inp=`<input id="${id}" type="${f.t||'text'}" value="${esc(v)}"${f.step?` step="${f.step}"`:''}${f.min!=null?` min="${f.min}"`:''}>`;
  return `<div class="${cls}"><label for="${id}">${esc(f.l)}</label>${inp}</div>`;
}
function openForm(title,fields,vals,onSave,onDelete){
  FC={fields,onSave,onDelete};
  showModal(`<h2>${esc(title)}</h2><form id="fm" class="fgrid" novalidate>${fields.map(f=>fieldHTML(f,vals[f.k])).join('')}<p class="ferr" id="ferr" hidden></p><div class="factions">${onDelete?'<button type="button" class="btn danger" data-act="fdel">Apagar</button>':''}<span class="sp"></span><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`);
  $('#fm').addEventListener('submit',ev=>{ev.preventDefault();const v={};FC.fields.forEach(f=>{const id='f_'+f.k;if(f.t==='scale'){const c=document.querySelector(`input[name="${id}"]:checked`);v[f.k]=c?Number(c.value):null}else{let x=document.getElementById(id).value;if(f.t==='number')x=x===''?null:Number(x);v[f.k]=typeof x==='string'?x.trim():x}});
    const err=FC.onSave(v);if(err){const p=$('#ferr');p.textContent=err;p.hidden=false;return}save();closeModal();render()});
}
const optTut=()=>[['','—'],...S.tutores.map(t=>[t,t])];
const optEst=()=>EV().map(e=>[e.id,e.nome]);
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}

const A={};
A.tab=el=>{UI.tab=el.dataset.k;try{localStorage.setItem(KEY+'_tab',UI.tab)}catch(e){}render();window.scrollTo(0,0)};

A.fdel=el=>{if(!el.dataset.armed){el.dataset.armed=1;el.textContent='Confirmar apagar';return}FC.onDelete();save();closeModal();render();toast('Apagado')};

  const e=el.dataset.id?estById(el.dataset.id):null;

  openForm(e?'Editar estagiário':'Novo estagiário',[
    {k:'nome',l:'Nome curto',full:1},{k:'nomeCompleto',l:'Nome completo',full:1},
    {k:'tel',l:'Telemóvel',t:'tel'},{k:'email',l:'Email',t:'email'},{k:'nascimento',l:'Data de nascimento',t:'date'},{k:'escola',l:'Escola / curso'},
    {k:'morada',l:'Morada',full:1},{k:'cp',l:'Código postal'},{k:'estadoCivil',l:'Estado civil'},
    {k:'nif',l:'NIF'},{k:'cc',l:'N.º Cartão de Cidadão'},{k:'funcao',l:'Função'},{k:'dataFicha',l:'Data da ficha',t:'date'},{k:'emNome',l:'Emergência: nome'},{k:'emParent',l:'Emergência: parentesco'},{k:'emTel',l:'Emergência: telemóvel',t:'tel'},
    {k:'local',l:'Local',t:'select',opts:[['','—'],'PNF','LSD']},{k:'tutor',l:'Tutor TEF',t:'select',opts:tut},
    {k:'horasReq',l:'Horas exigidas',t:'number',min:0},{k:'inicio',l:'Início do estágio',t:'date'},{k:'fim',l:'Fim do estágio',t:'date'},
    {k:'tshirt',l:'Tamanho t-shirt',t:'select',opts:TAM},{k:'casaco',l:'Tamanho casaco',t:'select',opts:TAM},
    {k:'notas',l:'Notas',t:'textarea',full:1}],
    e||{tshirt:'M',casaco:'M'},
    v=>{if(!v.nome)return 'Indica o nome do estagiário.';if(e)Object.assign(e,v);else S.est.push({id:uid(),entT:0,entC:0,entData:'',...v})},
    e?()=>{S.est=S.est.filter(x=>x.id!==e.id);S.horarios=S.horarios.filter(s=>s.estId!==e.id);S.registos=S.registos.filter(r=>r.estId!==e.id);S.aval=S.aval.filter(a=>a.estId!==e.id);S.form.forEach(f=>delete f.pres[e.id])}:null);

function juntar(o){
  let nE=0,uE=0;
  o.est.forEach(x=>{const e=S.est.find(y=>y.id===x.id)||S.est.find(y=>y.nome===x.nome);
    if(e){Object.keys(x).forEach(k=>{if(k!=='id'&&x[k]!==''&&x[k]!=null&&(e[k]===''||e[k]==null||['nomeCompleto','email','nascimento','morada','cp','estadoCivil','nif','cc','funcao','dataFicha','emNome','emParent','emTel'].includes(k)))e[k]=x[k]});if(e.id!==x.id){const old=x.id;['horarios','registos','aval'].forEach(c=>(o[c]||[]).forEach(r=>{if(r.estId===old)r.estId=e.id}))}uE++}
    else{S.est.push(x);nE++}});
  ['horarios','registos','aval'].forEach(c=>(o[c]||[]).forEach(r=>{if(!S[c].some(y=>y.id===r.id))S[c].push(r)}));
  if(o.pins&&Object.keys(o.pins).length){const usados=new Set([...S.est.map(e=>e.tutor),...S.horarios.map(h=>h.tutor)].filter(Boolean));S.tutores=[...(o.tutores||[]),...S.tutores.filter(t=>usados.has(t)&&!(o.tutores||[]).includes(t))];S.pins=Object.assign({},o.pins)}
  else (o.tutores||[]).forEach(t=>{if(!S.tutores.includes(t))S.tutores.push(t)});
  return `${uE} ficha(s) atualizada(s), ${nE} estagiário(s) novo(s)`;
}

{id:'mv',t:'Missão e valores',tipo:'leitura',html:`<h4>Porquê treinar connosco?</h4><p>Somos uma equipa focada na promoção de estilos de vida saudáveis com o intuito de alcançar o bem-estar geral e a qualidade de vida plena.</p><p>Situamo-nos orgulhosamente na cidade de Penafiel, região do Vale do Sousa, e temos a certeza de que todos se sentirão confortáveis no nosso espaço.</p><p>Assumimos o compromisso de lhe oferecer o melhor serviço possível, com um acompanhamento de excelência a um preço justo.</p>
<h4>Missão</h4><p>A nossa missão é transmitir conhecimento e motivação para a prática de exercício físico e corretos hábitos nutricionais, como instrumentos chave na construção de um estilo de vida saudável, cultivando em simultâneo um espírito de comunidade e urbanidade.</p>
<h4>Valores</h4><p><b>Paixão por ser saudável.</b> Acreditamos que ser ativo e adotar estilos de vida saudáveis interfere diretamente na sua qualidade de vida. O nosso compromisso é partilhar consigo o nosso conhecimento, recursos, ferramentas e entusiasmo com o objetivo de fazê-lo acreditar que é possível adquirir as habilidades e a confiança necessária para atingir os seus objetivos. SER MAIS SAUDÁVEL…</p><p><b>Alcançar resultados.</b> Ambicionamos que alcance sempre os seus objetivos e a nossa equipa compromete-se a acompanhá-lo nesse caminho.</p><p><b>Serviço de excelência.</b> Queremos superar as suas expectativas e assim torná-lo um promotor ativo da adoção de estilos de vida saudáveis.</p><p><b>Padrões de qualidade.</b> Procuramos sempre oferecer-lhe um serviço de elevada qualidade. Definimos a nossa qualidade através da avaliação de diversos itens como limpeza, segurança, serviços prestados, resultados alcançados, disponibilidade e facilidade de acesso.</p><p><b>Ambiente convidativo.</b> Esforçamo-nos para criar um ambiente agradável e divertido que reflita os interesses de todas as pessoas que servimos. Queremos que as nossas instalações sejam um espaço confortável e agradável para prática de exercício físico, onde possa livremente interagir e criar novos laços sociais.</p><p><b>Boa relação qualidade/preço.</b> Investimos todos os dias para estar na vanguarda dos serviços que disponibilizamos, otimizamos os nossos recursos para lhe fazer chegar o melhor serviço ao melhor preço.</p><p><b>Inovação.</b> Valorizamos a mudança e criação de novos projetos. Esforçamo-nos para sermos agentes ativos na inovação e criação de novas ideias e conceitos.</p>`},
{id:'mf',t:'Manifesto da cultura Playlife',tipo:'leitura',html:`<p><b>1. Comunicação interna.</b> Somos uma empresa de colaboradores empáticos e simpáticos entre nós. Somos compreensivos com os colegas e exigentes connosco e com os outros. O ambiente é agradável.</p><p><b>2. Confiança.</b> Confiamos uns nos outros. Acreditamos uns nos outros, pois sabemos que agem de boa-fé.</p><p><b>3. Exigência.</b> Prestamos contas uns aos outros. Estamos à vontade para criticar e pedir contas, mesmo aos superiores hierárquicos. Não compactuamos com a mediocridade, por isso cada membro deve auto exigir e exigir aos outros. Festejamos as vitórias e puxamos pelos outros, mas não permitimos que se arranjem desculpas para justificar os resultados fracos.</p><p><b>4. Gestão de conflitos.</b> A divergência de opiniões é um impulso importante, um estímulo para as equipas e para as empresas. É por isso crítico distinguir o conflito ideológico (de pessoas apaixonadas e que se batem pelas suas convicções), que é saudável e positivo, do conflito pessoal, que é mesquinho e estéril. Um diálogo musculado, ideológico, faz parte da nossa cultura. Não discutimos pessoas, discutimos ideias. Elogiamos pessoas, criticamos comportamentos.</p><p><b>5. Sentido de urgência.</b> A nossa empresa é como um barco, e como tal, para chegar a um bom porto precisa da ação e colaboração de todos. Se há uma coisa para fazer, é para fazer já, e não deixar para depois.</p><p><b>6. Sentido de propriedade.</b> A empresa é um organismo vivo do qual todos fazem parte, sem exceção. A empresa pertence-nos e nós pertencemos-lhe. Seremos os primeiros a arregaçar as mangas nos momentos críticos.</p><p><b>7. Transparência.</b> A nossa cultura assenta no reconhecimento de dizermos a verdade, de nos cingirmos aos factos. De pessoas verdadeiras e transparentes.</p><p><b>8. Foco.</b> Não há resultados sem concentração. Somos uma cultura que busca a performance, e uma cultura de performance é uma cultura de foco.</p><p><b>9. Simpatia.</b> A cordialidade e a simpatia são regra da nossa empresa. Sem isso não podemos almejar ser uma equipa vencedora e de sucesso.</p><p><b>10. Reconhecimento.</b> Somos uma empresa em que os colaboradores reconhecem e valorizam o esforço, a dedicação e a qualidade dos outros.</p><p><b>11. Resiliência.</b> Acreditamos que em cada desafio há uma oportunidade.</p><p><b>12. Exemplo.</b> Primamos pelo exemplo a todos os níveis. Queremos ser um exemplo para todos os nossos clientes e colegas. Fazemos da promoção da saúde o nosso estilo de vida.</p>`},

const REL_C=[['aula','Aula'],['data','Data'],['obj','Objetivo'],['mais','Pontos (+)'],['menos','Pontos (−)'],['obs','Observações']];
const CK=[['cumpre','Cumpre'],['melhorar','A melhorar'],['na','N/A']];

const fichaCheia=(s,d)=>s.campos.every((c,i)=>String(d?.v?.[i]||'').trim());
function secProg(s,dos){
  dos=dos||{};
  if(s.tipo==='leitura')return {p:dos[s.id]?.lido?2:0,m:2};
  if(s.tipo==='relatorios'){const sc=(dos.rel||[]).map(r=>(relCheio(r)?1:0)+(r.pt?1:0)).sort((a,b)=>b-a).slice(0,s.min);return {p:sc.reduce((a,b)=>a+b,0),m:2*s.min}}
  let p=0;s.itens.forEach(it=>{const d=dos[it.id]||{};if(s.tipo==='checklist'){if(d.r)p+=2}else{if(s.tipo==='ficha'?fichaCheia(s,d):d.al)p++;if(d.pt)p++}});
  return {p,m:2*s.itens.length};
}
function dosProg(dos){let p=0,m=0;const secs={};DOS.forEach(s=>{const x=secProg(s,dos);secs[s.id]=x;p+=x.p;m+=x.m});return {p,m,pct:m?Math.round(p/m*100):0,secs}}
const pctOf=x=>x.m?Math.round(x.p/x.m*100):0;
const barHTML=x=>{const p=pctOf(x);return `<div class="track"><i class="${p>=100?'done':''}" style="width:${p}%"></i></div><span class="small">${p}%</span>`};

}
function dosSecHTML(s,dos,o){

  if(s.tipo==='rubrica'||s.tipo==='checklist'){let g0=null;return `<div class="rlist">${s.itens.map(it=>{const d=dos[it.id]||{};const h=it.g&&it.g!==g0?`<h4 class="rg">${esc(g0=it.g)}</h4>`:'';
    if(s.tipo==='checklist')return h+`<div class="ritem${d.r?' done':''}"><span>${esc(it.t)}${d.pt?`<small class="muted"> · ${esc(d.pt)}</small>`:''}</span><span class="rcols">${CK.map(([v,l])=>`<label class="mini"><input type="radio" name="ck_${idu(it.id)}" value="${v}" data-chg="al_ck" data-i="${it.id}"${d.r===v?' checked':''}${o.tef?'':' disabled'}>${l}</label>`).join('')}</span></div>`;
    return h+`<div class="ritem${d.pt?' done':''}"><span>${esc(it.t)}</span><span class="rcols"><label class="mini"><input type="checkbox" data-chg="al_al" data-i="${it.id}"${d.al?' checked':''}${o.edit&&!d.pt?'':' disabled'}>Aluno</label>${ptCell(it.id,d,o)}</span></div>`}).join('')}</div>`}
  if(s.tipo==='ficha'){
    if(o.ro)return `<div class="tbl-wrap"><table><thead><tr><th>Item</th>${s.campos.map(c=>`<th>${esc(c)}</th>`).join('')}<th>PT</th></tr></thead><tbody>${s.itens.map(it=>{const d=dos[it.id]||{};return `<tr><td><b>${esc(it.t)}</b></td>${s.campos.map((c,i)=>`<td class="small">${esc(d.v?.[i]||'')||'<span class="muted">—</span>'}</td>`).join('')}<td>${d.pt?`<span class="pill ok">${esc(d.pt)}</span>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`;
    return s.itens.map(it=>{const d=dos[it.id]||{},op=o.open&&o.open[it.id];return `<div class="fi${d.pt?' done':''}"><button type="button" class="fi-h" data-act="al_tog" data-i="${it.id}" aria-expanded="${!!op}"><b>${esc(it.t)}</b><span data-pill="${it.id}">${fichaPill(s,d)}</span></button>${op?`<div class="fi-b">${s.campos.map((c,i)=>`<div class="fld"><label for="fv_${idu(it.id)}_${i}">${esc(c)}</label><textarea id="fv_${idu(it.id)}_${i}" rows="2" data-chg="al_fld" data-i="${it.id}" data-k="${i}"${o.edit&&!d.pt?'':' disabled'}>${esc(d.v?.[i]||'')}</textarea></div>`).join('')}<div class="rcols">${ptCell(it.id,d,o)}</div></div>`:''}</div>`}).join('')}
  if(s.tipo==='relatorios'){const R=dos.rel||[];
    const cards=R.map((r,ix)=>{const dis=o.edit&&!r.pt?'':' disabled';return `<div class="panel rel"><div class="bar-head"><b>Relatório ${ix+1}</b><span class="sp"></span>${r.pt?`<span class="pill ok">validado · ${esc(r.pt)}</span>`:relCheio(r)?'<span class="pill acc">preenchido</span>':'<span class="pill">por preencher</span>'}${o.edit&&!r.pt?`<button class="btn sm danger" type="button" data-act="al_relDel" data-r="${ix}">Apagar</button>`:''}</div><div class="fgrid">${REL_C.map(([k,l])=>`<div class="fld${k==='aula'||k==='data'?'':' full'}"><label for="rl_${ix}_${k}">${l}</label>${k==='data'?`<input type="date" id="rl_${ix}_${k}" value="${esc(r[k]||'')}" data-chg="al_relf" data-r="${ix}" data-k="${k}"${dis}>`:`<textarea id="rl_${ix}_${k}" rows="2" data-chg="al_relf" data-r="${ix}" data-k="${k}"${dis}>${esc(r[k]||'')}</textarea>`}</div>`).join('')}</div>${o.tef?`<label class="mini pt"><input type="checkbox" data-chg="al_relpt" data-r="${ix}"${r.pt?' checked':''}>Validado pelo TEF</label>`:''}</div>`}).join('');
    return `<p class="small muted" style="margin:0">Um relatório por cada aula de grupo lecionada. Contam os 3 melhores.</p>${cards||(o.ro?'<p class="empty">Sem relatórios.</p>':'')}${o.edit?'<button class="btn" type="button" data-act="al_relAdd">Adicionar relatório</button>':''}`}
  return '';
}

function alSlots(d){const m=alMe(),dow=pd(d).getDay();return LT.semana(AL.cfg,m.id,segunda(d)).slots.filter(s=>s.dia===dow).sort((a,b)=>a.ini.localeCompare(b.ini))}
function alExpected(from,to){const out=[];let n=0;for(let d=from;d<=to&&n<800;d=addD(d,1),n++)alSlots(d).forEach(s=>out.push({date:d,ini:s.ini,fim:s.fim,local:s.local,key:d+'|'+s.ini}));return out}

const formAberta=f=>f.data<=hoje()&&f.data>=addD(hoje(),-7);
function alTot(){const m=alMe();let pend=0,falt=0;const its=[];Object.values(AL.reg).forEach(r=>{if(r.falta)falt++;else if(r.tef)its.push({date:r.date,ini:r.start,fim:r.end,cat:r.tipo==='aula'?'aula':'sala'});else pend+=dur(r.start,r.end)});
  (AL.cfg.form||[]).filter(f=>alPresF(f)).forEach(f=>its.push(fItem(f,(AL.formPres||{})[f.id])));
  const h=contaHoras(its),ant=Math.round((Number(m.horasAnt)||0)*60);return {conf:h.sala+h.aulas,sala:h.sala,aulas:h.aulas,pend,falt,form:h.form,ant,total:h.total+ant}}
const ST={conf:['ok','Confirmado'],pend:['warn','Falta confirmação'],falta:['bad','Faltou'],por:['bad','Por registar'],fut:['','Agendado']};
function alStatus(s,rg){if(rg){if(rg.falta)return 'falta';return rg.tef?'conf':'pend'}return s.date<hoje()?'por':'fut'}
function shiftBtn(s,rg){const st=alStatus(s,rg),p=ST[st],x=rg||{},dt=pd(s.date);
  return `<button class="shift" type="button" data-act="al_shift" data-k="${esc(s.key)}"><span class="sd"><b>${D3[dt.getDay()]}</b><small>${dt.getDate()} ${MES[dt.getMonth()]}</small></span><span class="sm"><b>${x.tipo==='aula'?'Aula · '+esc(x.aula||''):s.extra?'Extra':(TCOD[s.ini]||'Turno')}</b> · ${x.start||s.ini}–${x.end||s.fim}${s.local?' · '+esc(locNome(s.local)):''}${x.tef?`<small>Confirmado por ${esc(x.tef)}</small>`:''}${x.nota?`<small>“${esc(x.nota)}”</small>`:''}</span><span class="pill ${p[0]}">${p[1]}</span></button>`}
function alMonthRows(y,mo){const f=`${y}-${String(mo+1).padStart(2,'0')}-01`,t=ds(new Date(y,mo+1,0));const rows=alExpected(f,t).map(s=>({...s,rg:AL.reg[s.key]}));const seen=new Set(rows.map(r=>r.key));
  Object.entries(AL.reg).forEach(([k,x])=>{if(!seen.has(k)&&x.date>=f&&x.date<=t)rows.push({date:x.date,ini:x.ini,fim:x.fim,local:x.local,key:k,extra:true,rg:x})});return rows.sort((a,b)=>(a.date+a.ini).localeCompare(b.date+b.ini))}

  if(AUI.esc)return `<div class="bar-head"><h2 class="sec">Escolher turnos</h2></div>${escolhaHTML()}`;
  const m=alMe(),w=AUI.week,dias=[...Array(7)].map((_,i)=>addD(w,i));
  const head=dias.map(d=>{const dt=pd(d);return `<th class="${d===hoje()?'hj':''}">${D3[dt.getDay()]}<br>${dt.getDate()}</th>`}).join('');
  const rows=GRID.map(([cod,mp])=>`<tr><th class="tc">${cod}</th>${dias.map(d=>{const dia=pd(d).getDay(),h=mp[dia];if(!h)return '<td class="off"></td>';const s=alSlots(d).find(x=>x.ini===h[0]);return `<td class="${s?'me':''}${d===hoje()?' hj':''}"><span class="hr">${h[0]}<br>${h[1]}</span>${s&&s.local?`<b class="loc">${esc(s.local)}</b>`:''}</td>`}).join('')}</tr>`).join('');
  const lista=dias.flatMap(d=>alSlots(d).map(s=>({d,s})));
  const wk=lista.reduce((a,x)=>a+dur(x.s.ini,x.s.fim),0);
  const forms=(AL.cfg.form||[]).slice().sort((a,b)=>a.data.localeCompare(b.data)).map(f=>`<div class="ritem"><span><b>${f.n}.</b> ${fmtD(f.data)} · ${esc(f.tema||'Tema por definir')}<small class="muted" style="display:block">${esc(f.formador||'')}${f.local?' · '+esc(f.local):''}${f.ini?' · '+esc(f.ini+'–'+f.fim):''}</small>${f.sumario?`<small style="display:block;margin-top:2px">${esc(f.sumario.split('\n')[0])}</small>`:''}</span><span class="rcols">${alPresF(f)?`<span class="pill ok">presente</span>`:formAberta(f)?`<button class="btn sm primary" type="button" data-act="al_formConf" data-id="${f.id}">Confirmar presença</button>`:f.data<hoje()?'<span class="pill">sem presença</span>':'<span class="pill acc">agendada</span>'}</span></div>`).join('');
  return `<div class="bar-head"><h2 class="sec">O meu horário</h2></div>

  <div class="tbl-wrap"><table class="grade-t al"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  ${w>segunda(hoje())&&alEstadoSemana(w)[1]==='Por validar'?'<p class="small" style="margin:0"><span class="pill warn">Por validar</span> O horário mostrado é o atual; a tua escolha para esta semana aguarda validação.</p>':''}
  ${escolhasHTML()}
  <div class="al-grid"><div class="panel"><div class="bar-head"><h3 style="margin:0">Esta semana</h3><span class="sp"></span><b>${fmtH(wk)}</b></div>${lista.length?lista.map(({d,s})=>`<div class="ritem"><span><b>${fmtD(d)}</b> · ${TCOD[s.ini]||''} ${s.ini}–${s.fim}</span><span class="pill acc">${esc(locNome(s.local)||'—')}</span></div>`).join(''):'<p class="empty">Sem turnos nesta semana.</p>'}</div>
  <div class="panel"><h3>Formações de sexta</h3>${forms||'<p class="empty">Sem formações.</p>'}</div></div>`;
};
VA.pres=()=>{
  const y=AUI.year,mo=AUI.mon,td=hoje();
  const rows=alMonthRows(y,mo);let c=0,p=0,f=0;
  rows.forEach(s=>{const st=alStatus(s,s.rg);if(st==='conf')c+=dur(s.rg.start,s.rg.end);else if(st==='pend')p+=dur(s.rg.start,s.rg.end);else if(st==='falta'||st==='por')f++});
  return `<div class="bar-head"><button class="btn sm" type="button" data-act="al_mon" data-d="-1" aria-label="Mês anterior">‹</button><h2 class="sec" style="flex:1;text-align:center">${MESL[mo]} ${y}</h2><button class="btn sm" type="button" data-act="al_mon" data-d="1" aria-label="Mês seguinte">›</button></div>
  <div class="al-grid pres-g"><div class="al-col al-side"><div class="stats"><div class="stat"><b>${fmtH(c)}</b><span>confirmadas</span></div><div class="stat"><b>${fmtH(p)}</b><span>sem confirmação</span></div><div class="stat"><b>${f}</b><span>faltas / por registar</span></div></div>
  <p class="small muted" style="margin:0">Toca num turno para registar a entrada e a saída. O TEF em sala confirma com o PIN dele. As aulas de grupo também contam: regista-as e o instrutor confirma. Só as horas confirmadas contam.</p>
  <div class="inline"><button class="btn" type="button" data-act="al_aula">Registar aula de grupo</button><button class="btn" type="button" data-act="al_pdf">Relatório do mês (PDF)</button><button class="btn primary" type="button" data-act="al_send">Enviar dados ao coordenador</button></div></div>
  <div class="al-col al-main"><div class="panel">${rows.length?`<div class="shifts">${rows.map(s=>shiftBtn(s,s.rg)).join('')}</div>`:'<p class="empty">Sem turnos neste mês.</p>'}</div></div></div>`;

    <h2 class="sec">${s.n}. ${esc(s.t)}</h2><div class="prog" data-bar="${s.id}">${barHTML(dp.secs[s.id])}</div>

    ${s.tipo==='checklist'?'<p class="small muted" style="margin:0">Esta checklist é preenchida pelo TEF ou professor que assistiu à aula, em modo TEF.</p>':''}
    <div class="dsec">${dosSecHTML(s,AL.dos,{edit:true,tef:isTef(),open:AUI.open})}</div></div></div>`}
  const m=alMe(),id=AL.dos.ident||{};
  const hor=[1,2,3,4,5,6,0].map(dia=>{const sl=(AL.cfg.horarios||[]).filter(s=>s.estId===m.id&&s.dia===dia&&(!s.ate||s.ate>=hoje())&&(!s.de||s.de<=addD(hoje(),6)));return sl.length?`${DIAS[dia]}: ${sl.map(s=>(TCOD[s.ini]||'')+' '+s.ini+'–'+s.fim).join(', ')}`:''}).filter(Boolean).join(' · ');
  return `<h2 class="sec">Dossier de estágio</h2><div class="al-grid dos-ov"><div class="al-col">
  <div class="panel"><div class="bar-head"><b>Progresso total</b></div><div class="prog" data-bar="tot">${barHTML(dp)}</div></div>
  <div class="panel"><h3>Identificação</h3><dl class="kv"><dt>Nome</dt><dd>${esc(m.nome)}</dd><dt>Tutor</dt><dd>${esc(m.tutor)||'—'}</dd><dt>Horário</dt><dd>${esc(hor)||'—'}</dd></dl>
  <div class="fgrid" style="margin-top:10px"><div class="fld"><label for="id_c">Contacto</label><input id="id_c" type="tel" value="${esc(id.contacto||'')}" data-chg="al_ident" data-k="contacto"></div><div class="fld"><label for="id_e">Entidade formação</label><input id="id_e" value="${esc(id.entidade||m.escola||'')}" data-chg="al_ident" data-k="entidade"></div><div class="fld full"><label for="id_o">Observações</label><textarea id="id_o" rows="2" data-chg="al_ident" data-k="obs">${esc(id.obs||'')}</textarea></div></div></div></div>
  <div class="secs al-col">${DOS.map(s=>`<button class="secbtn" type="button" data-act="al_sec" data-s="${s.id}"><span class="n">${s.n}</span><span style="min-width:0"><b>${esc(s.t)}</b><span class="prog" data-bar="${s.id}">${barHTML(dp.secs[s.id])}</span></span></button>`).join('')}</div></div>`;
};

/* PIN do TEF */
function tefOpts(){return `<option value="">Escolhe o TEF</option>${(AL.cfg.tefs||[]).map(t=>`<option>${esc(t.nome)}</option>`).join('')}`}
function tefPinModal(onOk,title){AUI.pinOk=onOk;showModal(`<h2>${esc(title)}</h2><p class="small muted" style="margin:0">O TEF em sala escolhe o nome e escreve o PIN.</p><div class="fgrid"><div class="fld"><label for="tp_n">TEF</label><select id="tp_n">${tefOpts()}</select></div><div class="fld"><label for="tp_p">PIN</label><input id="tp_p" type="password" inputmode="numeric" autocomplete="off"></div></div><p class="ferr" id="ferr" hidden></p><div class="factions"><span class="sp"></span><button class="btn ghost" type="button" data-act="close">Cancelar</button><button class="btn primary" type="button" data-act="al_pinOk">Confirmar</button></div>`)}
function lerAval(){const el=$('#tp_av');if(!el)return null;const v=el.value.trim();if(v===''){ferr('O avaliador tem de dar uma nota de 0 a 20.');return undefined}const n=Number(v.replace(',','.'));if(!Number.isFinite(n)||n<0||n>20){ferr('A nota tem de estar entre 0 e 20.');return undefined}return Math.round(n*10)/10}
function ferr(msg){const e=$('#ferr');if(e){e.textContent=msg;e.hidden=false}}
function checkPin(){const n=$('#tp_n').value,p=$('#tp_p').value.trim(),t=(AL.cfg.tefs||[]).find(x=>x.nome===n);if(!t){ferr('Escolhe o TEF que está em sala.');return null}if(!t.pin){ferr('Este TEF ainda não tem PIN. Pede ao coordenador para o definir.');return null}const z=x=>String(x).trim().replace(/^0+/,'');if(z(p)!==z(t.pin)){ferr('PIN incorreto.');return null}return n}
A.al_pinOk=async()=>{const n=await checkPinAny();if(n){const f=AUI.pinOk;closeModal();f(n)}};
A.al_tefStart=()=>tefPinModal(n=>{AUI.tef={nome:n,ate:Date.now()+15*60000};renderAluno();toast('Modo TEF ativo durante 15 minutos')},'Validação pelo TEF');
A.al_tefEnd=()=>{AUI.tef=null;renderAluno()};

/* Registo de presença */
const MODAL_AULAS=['Indoor Cycling','Pilates','Hyrox','Crossfit','Desportos de academia','Localizada','Step','Zumba','Yoga','I-Motion (EMS)'];
const PAPEIS=['Assistiu','Apoiou o instrutor','Lecionou'];
function alOpenReg(s){AUI.cur=s;const rg=AL.reg[s.key]||{},lock=!!rg.tef,dt=pd(s.date),au=s.aula||rg.tipo==='aula';
  showModal(`<h2>${au?'Aula de grupo':DIAS[dt.getDay()]+' '+fmtDY(s.date)}</h2><p class="small muted" style="margin:0">${au?'Regista uma aula de grupo em que participaste. O instrutor da aula confirma com o PIN dele.':s.extra?'Turno extra':(TCOD[s.ini]||'Turno')+' · previsto '+s.ini+'–'+s.fim}${!au&&s.local?' · '+esc(locNome(s.local)):''}</p>
  ${au?`<div class="fgrid"><div class="fld"><label for="r_data">Data</label><input type="date" id="r_data" value="${rg.date||s.date}" max="${hoje()}" data-chg="al_mapaDia"${lock?' disabled':''}></div><div class="fld"><label for="r_loc">Clube</label><select id="r_loc" data-chg="al_mapaDia"${lock?' disabled':''}>${LOCS.map(([k,n])=>`<option value="${k}"${(rg.local||s.local||alMe().local)===k?' selected':''}>${n}</option>`).join('')}</select></div>
  <div class="fld full"><label for="r_mapa">Aula do mapa</label><select id="r_mapa" data-chg="al_mapa"${lock?' disabled':''}>${mapaOpts(rg.date||s.date,rg.local||s.local||alMe().local,rg)}</select></div><div class="fld"><label for="r_aula">Modalidade</label><input id="r_aula" list="r_aulas" value="${esc(rg.aula||'')}" placeholder="ex.: Pilates"${lock?' disabled':''}><datalist id="r_aulas">${MODAL_AULAS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div class="fld"><label for="r_papel">O que fizeste</label><select id="r_papel"${lock?' disabled':''}>${PAPEIS.map(x=>`<option${(rg.papel||'Apoiou o instrutor')===x?' selected':''}>${x}</option>`).join('')}</select></div></div>`:''}
  ${lock?`<p style="margin:0"><span class="pill ok">Confirmado por ${esc(rg.tef)}</span> <span class="small muted">${new Date(rg.confEm).toLocaleString('pt-PT')}</span></p><p class="small muted" style="margin:0">Um registo confirmado já não pode ser alterado.</p>`:''}
  <div class="fgrid"><div class="fld"><label for="r_in">Entrada</label><input type="time" id="r_in" value="${rg.start||s.ini}"${lock?' disabled':''}></div><div class="fld"><label for="r_out">Saída</label><input type="time" id="r_out" value="${rg.end||s.fim}"${lock?' disabled':''}></div><div class="fld full"><label for="r_nota">Nota (opcional)</label><input id="r_nota" value="${esc(rg.nota||'')}" placeholder="${au?'ex.: dei o aquecimento':'ex.: troca de turno, saí mais cedo'}"${lock?' disabled':''}></div></div>
  ${lock?'':`<div class="tefbox"><b>${au?'Confirmação do instrutor':'Confirmação do TEF'}</b><p class="small muted">${au?'O instrutor da aula escolhe o nome, escreve o PIN e avalia a prestação do estagiário.':'O TEF em sala escolhe o nome, escreve o PIN e avalia a prestação do estagiário.'}</p><div class="fgrid"><div class="fld"><label for="tp_n">TEF</label><select id="tp_n">${tefOpts()}</select></div><div class="fld"><label for="tp_p">PIN</label><input id="tp_p" type="password" inputmode="numeric" autocomplete="off"></div><div class="fld full"><label for="tp_av">Avaliação da prestação do estagiário (0 a 20)</label><input id="tp_av" type="number" min="0" max="20" step="1" inputmode="numeric" placeholder="0–20" style="max-width:120px"></div></div></div><p class="ferr" id="ferr" hidden></p>`}
  <div class="factions">${lock?'':`${au?'':'<button class="btn danger sm" type="button" data-act="al_rFalta">Não compareci</button>'}${AL.reg[s.key]?'<button class="btn danger sm" type="button" data-act="al_rDel">Apagar</button>':''}`}<span class="sp"></span><button class="btn ghost" type="button" data-act="close">Fechar</button>${lock?'':'<button class="btn" type="button" data-act="al_rSave">Guardar sem confirmar</button><button class="btn primary" type="button" data-act="al_rConf">Registar e confirmar</button>'}</div>`)}
function alCollect(){const s=AUI.cur,a=$('#r_in').value,b=$('#r_out').value;if(!a||!b||mins(b)<=mins(a)){ferr('Verifica as horas de entrada e de saída.');return null}const old=AL.reg[s.key]||{};
  if($('#r_aula')){const data=$('#r_data').value,aula=$('#r_aula').value.trim();if(!data||data>hoje()){ferr('Escolhe a data da aula (hoje ou antes).');return null}if(!aula){ferr('Escreve a modalidade da aula.');return null}
    if(data!==s.date){delete AL.reg[s.key];s.date=data;s.key=data+'|a'+(old.criado||Date.now())}
    return {date:data,ini:a,fim:b,local:$('#r_loc').value,extra:true,tipo:'aula',aula,papel:$('#r_papel').value,start:a,end:b,nota:$('#r_nota').value.trim(),criado:old.criado||Date.now()}}
  return {date:s.date,ini:s.ini,fim:s.fim,local:s.local||'',extra:!!s.extra,start:a,end:b,nota:$('#r_nota').value.trim(),criado:old.criado||Date.now()}}
A.al_rSave=()=>{const x=alCollect();if(!x)return;AL.reg[AUI.cur.key]=x;alSave();closeModal();renderAluno();toast('Guardado. Falta a confirmação do TEF')};
A.al_rConf=async()=>{const x=alCollect();if(!x)return;const av=lerAval();if(av===undefined)return;const n=await checkPinAny();if(!n)return;x.tef=n;x.confEm=Date.now();if(av!=null)x.aval=av;AL.reg[AUI.cur.key]=x;
  if(x.tipo==='aula'&&x.papel==='Lecionou'){AL.dos.rel=AL.dos.rel||[];if(!AL.dos.rel.some(r=>r.reg===AUI.cur.key))AL.dos.rel.push({id:uid(),reg:AUI.cur.key,aula:x.aula,data:x.date})}
  alSave();closeModal();renderAluno();toast(x.tipo==='aula'?(x.papel==='Lecionou'?'Aula confirmada. Criei o relatório no dossier para preencheres.':'Aula confirmada por '+n):'Presença confirmada por '+n)};
A.al_rFalta=()=>{const s=AUI.cur,n=$('#r_nota').value.trim();if(!n){ferr('Escreve o motivo da falta na nota.');return}AL.reg[s.key]={date:s.date,ini:s.ini,fim:s.fim,local:s.local||'',start:s.ini,end:s.fim,falta:true,nota:n,criado:Date.now()};alSave();closeModal();renderAluno()};
A.al_rDel=el=>{if(!el.dataset.armed){el.dataset.armed=1;el.textContent='Confirmar apagar';return}delete AL.reg[AUI.cur.key];alSave();closeModal();renderAluno()};
A.al_shift=el=>{const k=el.dataset.k,date=k.split('|')[0],rg=AL.reg[k];let s=alExpected(date,date).find(x=>x.key===k);if(!s&&rg)s={date,ini:rg.ini,fim:rg.fim,local:rg.local,key:k,extra:true,aula:rg.tipo==='aula'};if(s)alOpenReg(s)};
A.al_formConf=el=>{const f=(AL.cfg.form||[]).find(x=>x.id===el.dataset.id);if(!f)return;AUI.formCur=f.id;

async function shareBlob(blob,name,title){
  try{if(navigator.canShare&&window.File){const f=new File([blob],name,{type:blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title});return 'share'}}}catch(e){if(e&&e.name==='AbortError')return 'abort'}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return 'down'}catch(e){return null}
}

const OLDT={};for(let d=0;d<5;d++)OLDT[d]=[['06:30','10:30'],['10:30','13:30'],['13:30','16:30'],['16:30','19:30'],['19:30','22:30']];OLDT[5]=[['09:00','13:00'],['15:30','19:30']];OLDT[6]=[['09:30','12:30']];
function convOld(reg){const o={};Object.values(reg||{}).forEach(x=>{if(!x||!x.date)return;const t=typeof x.r==='number'&&OLDT[x.d]?OLDT[x.d][x.r]:null;const ini=t?t[0]:x.start,fim=t?t[1]:x.end;const k=x.date+'|'+(t?ini:'x'+(x.criado||ini));o[k]={date:x.date,ini,fim,local:'',start:x.start,end:x.end,nota:x.nota||'',tef:x.tef||'',confEm:x.confEm||null,falta:!!x.falta,extra:!t,criado:x.criado||Date.now()};if(!o[k].tef)delete o[k].tef});return o}

function recebeAluno(o){
  if(!o||typeof o!=='object')return null;
  if(o.tipo==='estagio-aluno'){const e=estById(o.id)||S.est.find(x=>x.nome===o.nome);if(!e)return null;const cur=S.recebidos[e.id];if(cur&&cur.exportadoEm>o.exportadoEm)return e.nome+' (já tinhas dados mais recentes)';S.recebidos[e.id]={exportadoEm:o.exportadoEm,reg:o.reg||{},dos:o.dos||{},formPres:o.formPres||{}};return e.nome}
  if(o.tipo==='presencas-estagio'){const e=S.est.find(x=>x.nome===o.nome);if(!e)return null;const r=S.recebidos[e.id]=S.recebidos[e.id]||{exportadoEm:o.exportadoEm,reg:{},dos:{}};const cv=convOld(o.registos);Object.keys(cv).forEach(k=>{if(!r.reg[k]||(!r.reg[k].tef&&cv[k].tef))r.reg[k]=cv[k]});return e.nome}
  return null;
}
function migrOld(){if(S.migrOld)return;S.migrOld=true;try{const oc=JSON.parse(localStorage.getItem('estagio_cfg_v1')||'null');if(oc&&Array.isArray(oc.tefs)){oc.tefs.forEach(t=>{if(!t.nome)return;if(!S.tutores.includes(t.nome))S.tutores.push(t.nome);if(t.pin&&!S.pins[t.nome])S.pins[t.nome]=String(t.pin)});if(oc.coordPin&&String(S.coordPin)==='2026')S.coordPin=String(oc.coordPin);if(oc.coordEmail&&!S.coordEmail)S.coordEmail=oc.coordEmail}const co=JSON.parse(localStorage.getItem('estagio_coord_v1')||'null');if(co)Object.values(co).forEach(o=>recebeAluno(o))}catch(e){}save()}

const alSrv=()=>AL.srv&&AL.srv.url&&AL.srv.codigo?AL.srv:null;
let apT=null;
function alPush(){if(!alSrv())return;clearTimeout(apT);apT=setTimeout(alPushNow,1500)}
async function alPushNow(){
  const s=alSrv();if(!s)return;clearTimeout(apT);
  try{const j=await api(s.url,{acao:'alunoGravar',codigo:s.codigo,dados:{upd:AL.upd||Date.now(),nome:alMe()?.nome||'',reg:AL.reg,dos:AL.dos,formPres:AL.formPres||{}}});
    if(j.ok){AL.pend=false;AL.syncEm=Date.now()}
    else if(j.antigo){AL.reg=j.dados.reg||{};AL.dos=j.dados.dos||{};AL.formPres=j.dados.formPres||{};AL.upd=j.dados.upd;AL.pend=false;toast('Havia dados mais recentes noutro dispositivo: atualizei.');if(MODO==='aluno')render()}
    else throw new Error(j.erro)}
  catch(e){AL.pend=true}
  alSaveLocal();
}
async function alPull(avisar,semPush){
  const s=alSrv();if(!s)return false;
  try{const j=await api(s.url,{acao:'alunoLer',codigo:s.codigo});if(!j.ok)throw new Error(j.erro||'Erro ao ler.');
    if(!j.cfg||!(j.cfg.est||[]).length)throw new Error('O coordenador ainda não publicou os horários. Tenta mais tarde.');
    AL.cfg=j.cfg;AL.me=j.id;if(j.pedidos)AL.pedidos=j.pedidos;
    if(j.dados&&(j.dados.upd||0)>(AL.upd||0)){AL.reg=j.dados.reg||{};AL.dos=j.dados.dos||{};AL.formPres=j.dados.formPres||{};AL.upd=j.dados.upd}
    AL.syncEm=Date.now();alSaveLocal();
    if(!semPush&&(AL.pend||(AL.upd&&(!j.dados||(j.dados.upd||0)<AL.upd))))alPushNow();
    if(avisar)toast('Atualizado');return true}
  catch(e){if(avisar)toast(e.message);AL.erro=e.message;return false}
}
async function alEntrar(url,codigo){
  codigo=String(codigo||'').trim().toUpperCase();
  const antes=AL.srv&&AL.srv.codigo,meAntes=AL.me;
  if(antes!==codigo&&(antes||!meAntes))AL={cfg:null,me:null,reg:{},dos:{},migr:true};
  const prev={reg:AL.reg,dos:AL.dos};
  AL.srv={url,codigo};alSaveLocal();
  const ok=await alPull(false,true);
  if(ok){if(!antes&&meAntes&&meAntes!==AL.me){AL.reg={};AL.dos={};AL.upd=0}
    else if(!antes&&meAntes===AL.me&&Object.keys(prev.reg||{}).length){AL.upd=Date.now();alPushNow()}
    AL.migr=true;alSaveLocal();AUI.v='hoje';setModo('aluno');return true}
  return false;
}
